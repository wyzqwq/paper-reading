    }
  } catch (err) {
    alert('读取文件失败：' + (err && err.message ? err.message : err));
    currentFileData = null;
  }
});

// ===== 导入辅助：arXiv 元数据解析 + 来源字段切换（M3）=====
// arXiv API 经 Supabase Edge Function 代理（M0 实测 export.arxiv.org 不发 ACAO，浏览器直连被 CORS 阻）
const ARXIV_PROXY = 'https://hjrrocbisrgtxgqnflpi.supabase.co/functions/v1/arxiv-proxy';
const ATOM_NS = 'http://www.w3.org/2005/Atom';

function extractArxivId(input) {
  // 接受 arXiv 链接（abs/pdf）或纯 ID；新式 2310.12345[v2]、老式 cs.LG/0701001[v2]
  if (!input) return null;
  const m = String(input).trim().match(/([0-9]{4}\.[0-9]+(?:v[0-9]+)?|[a-z.\-]+\/[0-9]{7}(?:v[0-9]+)?)/i);
  return m ? m[1] : null;
}

function textByTagNS(el, ns, tag) {
  const n = el.getElementsByTagNameNS(ns, tag)[0];
  return n ? (n.textContent || '').trim() : '';
}

function parseArxivEntry(entry) {
  // id 形如 http://arxiv.org/abs/1706.03762v2 -> 取 abs/ 后、去版本号
  const idText = textByTagNS(entry, ATOM_NS, 'id');
  const aidMatch = idText.match(/abs\/(.+?)(?:v\d+)?$/i);
  const arxiv_id = aidMatch ? aidMatch[1] : '';
  const title = textByTagNS(entry, ATOM_NS, 'title').replace(/\s+/g, ' ');
  const summary = textByTagNS(entry, ATOM_NS, 'summary').replace(/\s+/g, ' ');
  const authors = [];
  const authorEls = entry.getElementsByTagNameNS(ATOM_NS, 'author');
  for (let i = 0; i < authorEls.length; i++) {
    const n = textByTagNS(authorEls[i], ATOM_NS, 'name');
    if (n) authors.push(n);
  }
  const tags = [];
  const catEls = entry.getElementsByTagNameNS(ATOM_NS, 'category');
  for (let i = 0; i < catEls.length; i++) {
    const t = catEls[i].getAttribute('term');
    if (t) tags.push(t);
  }
  // published（M5 时效打分用）：形如 2026-08-01T00:00:00Z
  const published = textByTagNS(entry, ATOM_NS, 'published');
  return {
    arxiv_id,
    title,
    authors,
    abstract: summary,
    url: arxiv_id ? ('https://arxiv.org/abs/' + arxiv_id) : '',
    tags,
    published,
  };
}

// M5 日推：解析多 entry（搜索结果）。返回数组（无条目时为 []）
function parseArxivXmlList(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) {
    throw new Error('arXiv 返回非合法 XML');
  }
  const entries = doc.getElementsByTagNameNS(ATOM_NS, 'entry');
  const list = [];
  for (let i = 0; i < entries.length; i++) list.push(parseArxivEntry(entries[i]));
  return list;
}

function parseArxivXml(xml) {
  // M3 导入：取首条（保持原行为）
  const list = parseArxivXmlList(xml);
  if (!list.length) throw new Error('arXiv 未返回条目（ID 可能无效或被限流）');
  return list[0];
}

async function fetchArxiv() {
  const input = document.getElementById('f-arxiv-input').value;
  const aid = extractArxivId(input);
  const btn = document.getElementById('f-arxiv-fetch');
  if (!aid) { alert('无法识别 arXiv ID。请粘贴 arXiv 链接或 ID（如 1706.03762）。'); return; }
  btn.disabled = true; btn.textContent = '拉取中…';
  try {
    const res = await fetch(ARXIV_PROXY + '?id_list=' + encodeURIComponent(aid));
    if (!res.ok) throw new Error('代理返回 HTTP ' + res.status);
    const xml = await res.text();
    const meta = parseArxivXml(xml);
    if (!meta.title) throw new Error('未解析到标题');
    document.getElementById('f-title').value = meta.title;
    document.getElementById('f-authors').value = meta.authors.join(', ');
    document.getElementById('f-abstract').value = meta.abstract;
    document.getElementById('f-url').value = meta.url;
    document.getElementById('f-tags').value = meta.tags.join(', ');
    currentArxivId = meta.arxiv_id;
  } catch (e) {
    alert('arXiv 拉取失败：' + (e && e.message ? e.message : e));
  } finally {
    btn.disabled = false; btn.textContent = '拉取';
  }
}

function updateSourceFields() {
  const src = document.getElementById('f-source').value;
  document.getElementById('src-arxiv').style.display = (src === 'arxiv') ? '' : 'none';
  document.getElementById('src-local').style.display = (src === 'local') ? '' : 'none';
}

// ===== 阅读器（M2：pdf.js 连续滚动 + 进度记忆）=====
let pdfjsLib = null;
let readerState = null;

function resolvePdfUrl(p) {
  let u = p && p.url;
  if (!u) return null;
  // arXiv abs/pdf 链接统一转 https://arxiv.org/pdf/<id>（M0 实测 arxiv PDF CORS 通，可直连）
  const m = u.match(/arxiv\.org\/(?:abs|pdf)\/([0-9]{4}\.[0-9]+(?:v[0-9]+)?|[a-z.\-]+\/[0-9]{7}(?:v[0-9]+)?)/i);
  if (m) return 'https://arxiv.org/pdf/' + m[1];
  return u;
}

async function openReader(paper, jumpPage) {
  // 决定加载源：local 走 IndexedDB 二进制（dbGetFile）；arXiv/url 走 resolvePdfUrl（abs 归一化为 pdf）
  let url = null;
  let docInit = {};
  if (paper.source_type === 'local') {
    try {
      let file = await dbGetFile(paper.id);
      // IDB 缺失：从 Storage 下载（跨设备读本地 PDF 的关键路径），成功后回填 IDB 缓存
      if ((!file || !file.data) && sbSession()) {
        const buf = await sbDownloadPdf(paper.id);
        if (buf) {
          await dbPutFile({ id: paper.id, data: buf, size: buf.byteLength, added_at: nowISO() });
          file = { id: paper.id, data: buf };
        }
      }
      if (!file || !file.data) { alert('本地 PDF 文件缺失（本地与云端均无）。'); return; }
      docInit = { data: file.data };
    } catch (e) {
      alert('读取本地 PDF 失败：' + (e && e.message ? e.message : e));
      return;
    }
  } else {
    url = resolvePdfUrl(paper);
    if (!url) { alert('该条目没有可加载的 PDF 链接。'); return; }
    docInit = { url };
  }
  const overlay = document.getElementById('reader');
  overlay.classList.add('show');
  const scrollEl = document.getElementById('reader-scroll');
  scrollEl.innerHTML = '<div class="reader-loading">加载中…</div>';
  trCancel(); // 取消上一篇的预译 loop，防残留/干扰（bug1）
  document.getElementById('reader-pageinfo').textContent = '';
  document.getElementById('reader-progress-fill').style.width = '0%';

  if (!pdfjsLib) {
    try {
      pdfjsLib = await import('./vendor/pdfjs/pdf.min.mjs');
      pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdfjs/pdf.worker.min.mjs';
    } catch (e) {
      scrollEl.innerHTML = '<div class="reader-error">pdf.js 加载失败：' + escapeHtml(e && e.message || String(e)) + '</div>';
      return;
    }
  }
  // 取最新条目（用 DB 里的 read_progress 恢复，避免对象过期）
  let p = paper;
  try {
    const all = await dbAll();
    const fresh = all.find((x) => x.id === paper.id);
    if (fresh) p = fresh;
  } catch (e) { /* ignore */ }

  readerState = {
    paper: p, url, pdf: null, loadingTask: null, numPages: 0,
    canvases: [], baseScale: 1, zoom: 1, dpr: window.devicePixelRatio || 1,
    io: null, saveTimer: null, scrollEl, ready: false,
    textLayers: {},      // pageNum -> {layer, container, textDivs}（M4）
    textContentCache: {},// pageNum -> getTextContent 结果（M4，避免缩放重取）
    annos: [],           // 该论文全部高亮批注（M4）
    hlDraft: null,       // 当前菜单草稿（new/edit）
    tr: null             // v2 翻译状态 {enabled, pages:{num:{pairs,ready,status}}, done, total, cancelled, keyMissing}
  };
  trRenderStatus(); // 新 readerState.tr=null，清状态栏旧译文进度（bug1）

  try {
    const task = pdfjsLib.getDocument({
      ...docInit,
      wasmUrl: './vendor/pdfjs/wasm/',
      standardFontDataUrl: './vendor/pdfjs/standard_fonts/'
    });
    readerState.loadingTask = task;
    const pdf = await task.promise;
    readerState.pdf = pdf;
    readerState.numPages = pdf.numPages;
    // 拉该论文已有高亮批注（M4）
    try { readerState.annos = await dbGetAnnosByPaper(p.id); } catch (e) { readerState.annos = []; }
    await layoutPages();
    readerState.ready = true;
    setupReaderObserver();
    if (jumpPage) scrollToPage(jumpPage); else restoreReaderProgress();
    scrollEl.addEventListener('scroll', onReaderScroll, { passive: true });
    // 选区监听用 selectionchange（非 mouseup）：iOS 选文本松手时系统接管触摸、mouseup 不触发；
    // 改听 document selectionchange + 防抖 300ms，松手后选区稳定即弹高亮菜单，鼠标/触摸通用
    document.addEventListener('selectionchange', onReaderSelectionChange);
    // M7: 复刻官方 TextLayerBuilder.#enableGlobalSelectionListener 的 reset 监听：
    // pointerup/blur/keyup 时把 endOfContent 归位 + 移除 .selecting，避免 user-select:none 屏障常驻干扰后续选词
    document.addEventListener('pointerdown', onReaderPointerDown, { passive: true });
    document.addEventListener('pointerup', onReaderPointerUp, { passive: true });
    window.addEventListener('blur', onReaderWinBlur);
    document.addEventListener('keyup', onReaderKeyUp, { passive: true });
    scrollEl.addEventListener('click', onReaderClick);
    // M7: touch 监听全 passive（onReaderTouch* 只管 pinch，从不 preventDefault）。
    // 第5轮漏改 touchend 仍 passive:false，按当时理论会干扰 iOS 长按选词手势识别，补齐。
    scrollEl.addEventListener('touchstart', onReaderTouchStart, { passive: true });
    scrollEl.addEventListener('touchmove', onReaderTouchMove, { passive: true });
    scrollEl.addEventListener('touchend', onReaderTouchEnd, { passive: true });
  } catch (e) {
    scrollEl.innerHTML = '<div class="reader-error">PDF 加载失败：' +
      escapeHtml(e && e.message || String(e)) +
      '<br>可能文件损坏、网络问题或跨域限制。</div>';
  }
}

async function layoutPages() {
  const rs = readerState;
  const scrollEl = rs.scrollEl;
  scrollEl.innerHTML = '';
  rs.canvases = [];
  // 适配宽度算 baseScale（按第 1 页宽度），zoom 为倍数
  const containerW = scrollEl.clientWidth - 24;
  const page1 = await rs.pdf.getPage(1);
  const vp1 = page1.getViewport({ scale: 1 });
  rs.baseScale = containerW > 0 ? containerW / vp1.width : 1;
  const scale = rs.baseScale * rs.zoom;
  for (let i = 1; i <= rs.numPages; i++) {
    const page = i === 1 ? page1 : await rs.pdf.getPage(i);
    const vpRender = page.getViewport({ scale: scale * rs.dpr });
    const vpCss = page.getViewport({ scale });
    const div = document.createElement('div');
    div.className = 'reader-page';
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(vpRender.width);
    canvas.height = Math.ceil(vpRender.height);
    canvas.style.width = Math.round(vpCss.width) + 'px';
    canvas.style.height = Math.round(vpCss.height) + 'px';
    div.style.width = Math.round(vpCss.width) + 'px'; // M7：page 宽=canvas 宽，zoom>1 时 scrollEl 可水平滚动平移
    canvas._page = page;
    canvas._pageNum = i;
    canvas._renderedScale = 0;
    canvas._tlScale = 0; // textLayer 已渲染的 scale（M4）
    div.appendChild(canvas);
    // textLayer 容器（M4）：盖在 canvas 上，实际 TextLayer.render 在 renderPage 里懒渲染
    const tlDiv = document.createElement('div');
    tlDiv.className = 'textLayer';
    tlDiv.tabIndex = 0; // M7: 复刻官方 TextLayerBuilder constructor，iOS Safari 长按选词命中需可聚焦文本容器
    tlDiv.dataset.pageNum = i;
    tlDiv.style.width = Math.round(vpCss.width) + 'px';
    tlDiv.style.height = Math.round(vpCss.height) + 'px';
    div.appendChild(tlDiv);
    canvas._textLayerDiv = tlDiv;
    scrollEl.appendChild(div);
    rs.canvases.push(canvas);
  }
}

function setupReaderObserver() {
  const rs = readerState;
  rs.io = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) renderPage(e.target);
  }, { root: rs.scrollEl, rootMargin: '600px 0px' });
  rs.canvases.forEach((c) => rs.io.observe(c));
}

async function renderPage(canvas) {
  const rs = readerState;
  if (!rs) return;
  const renderScale = rs.baseScale * rs.zoom * rs.dpr;
  const page = canvas._page;
  // canvas 渲染
  if (canvas._renderedScale !== renderScale) {
    const vp = page.getViewport({ scale: renderScale });
    if (canvas.width !== Math.ceil(vp.width)) canvas.width = Math.ceil(vp.width);
    if (canvas.height !== Math.ceil(vp.height)) canvas.height = Math.ceil(vp.height);
    const ctx = canvas.getContext('2d');
    if (canvas._renderTask) { try { canvas._renderTask.cancel(); } catch (e) { /* ignore */ } }
    try {
      canvas._renderTask = page.render({ canvasContext: ctx, viewport: vp });
      await canvas._renderTask.promise;
      canvas._renderedScale = renderScale;
    } catch (e) {
      // RenderingCancelledException（缩放/关闭时取消），忽略
    }
  }
  // textLayer 渲染（M4，缩放变了就重建）+ 应用高亮
  const cssScale = rs.baseScale * rs.zoom;
  if (canvas._tlScale !== cssScale) {
    await renderTextLayer(canvas, cssScale);
    applyHighlights(canvas._pageNum);
    trApplyPage(canvas._pageNum); // v2：textLayer 重建后重铺译文叠层（缩放/懒渲染）
  }
}

// 聚合 streamTextContent 返回的 ReadableStream（M7）：iOS Safari 18.7 的 JavaScriptCore 不支持
// ReadableStream 的 async iteration（`for await...of` on ReadableStream 抛 TypeError "undefined is not a function"），
// 而 pdf.js getTextContent 内部正是 `for await(const t of streamTextContent(...))` 聚合 -> iOS 直接抛错、spanCount=0。
// 改用 getReader/read 手动聚合，不依赖 Symbol.asyncIterator。聚合后的 {items,styles,lang} 传给 TextLayer
// constructor 走 typeof==="object" 分支包装成新 ReadableStream，render() 用 getReader 读，全程绕开 async iteration。
async function aggregateTextContentStream(stream) {
  const reader = stream.getReader();
  const items = [];
  const styles = Object.create(null);
  let lang = null;
  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    if (!value) continue;
    if (lang == null && value.lang != null) lang = value.lang;
    if (value.styles) Object.assign(styles, value.styles);
    if (value.items) for (const it of value.items) items.push(it);
  }
  return { items, styles, lang };
}

// 渲染某页 textLayer（M4）：pdf.js v6 TextLayer，透明文字层供选中/高亮
async function renderTextLayer(canvas, cssScale) {
  const rs = readerState;
  if (!rs) return; // closeReader 后 pending renderPage 可能仍调用此函数，readerState 已 null（与 applyHighlights 守卫一致）
  const pageNum = canvas._pageNum;
  try {
    const page = canvas._page;
    const vpCss = page.getViewport({ scale: cssScale });
    const container = canvas._textLayerDiv;
    container.innerHTML = '';
    // pdf.js v6.2.108 官方 pdf_viewer.css 变量链：宿主设 --total-scale-factor，派生 --text-scale-factor，
    // leaf span font-size = text-scale-factor × --font-height（span inline 设），transform scaleX(var(--scale-x))。
    // 不设则 calc 里 --total-scale-factor 为空 -> font-size 回退 16px、无 scaleX -> 选区与 canvas 文字错位。
    // （旧代码误设 --scale-factor，官方不读此变量名；bf24844 的修复方向错了，本次纠正。）
    container.style.setProperty('--total-scale-factor', cssScale);
    let tc = rs.textContentCache[pageNum];
    if (!tc) {
      // M7: iOS Safari 不支持 ReadableStream 的 async iteration（for await...of 抛 TypeError "undefined is not a function"），
      // pdf.js getTextContent 内部用 `for await(const t of streamTextContent(...))` 聚合，iOS 直接抛错 -> spanCount=0。
      // 改用 streamTextContent 拿 ReadableStream + aggregateTextContentStream（getReader/read 手动聚合，不依赖 Symbol.asyncIterator）。
      const stream = page.streamTextContent({ includeMarkedContent: true, disableNormalization: false });
      tc = await aggregateTextContentStream(stream);
      rs.textContentCache[pageNum] = tc;
    }
    const tl = new pdfjsLib.TextLayer({
      textContentSource: tc, container, viewport: vpCss, textDivs: []
    });
    try { await tl.render(); } catch (e) { /* 缩放/关闭取消，忽略 */ }
    // 显式覆盖容器尺寸：setLayerDimensions 用 round()（旧浏览器可能不支持），且确保与 canvas 像素对齐
    container.style.width = Math.round(vpCss.width) + 'px';
    container.style.height = Math.round(vpCss.height) + 'px';
    // endOfContent（pdf.js v6 核心 TextLayer.render 不自动加，TextLayerBuilder 才创建）：
    // 配合 onReaderSelectionChange 的 Safari 分支动态挪位 + .selecting 类作 user-select:none 屏障
    let eoc = container.querySelector('.endOfContent');
    if (!eoc) {
      eoc = document.createElement('div');
      eoc.className = 'endOfContent';
      eoc.setAttribute('aria-hidden', 'true');
      container.appendChild(eoc);
    }
    rs.textLayers[pageNum] = { layer: tl, container, textDivs: tl.textDivs || [], endOfContent: eoc };
    canvas._tlScale = cssScale;
  } catch (e) {
    // textLayer 渲染失败静默（缩放/关闭取消或异常，不阻塞 canvas 阅读）
  }
}

function currentReaderPage() {
  const rs = readerState;
  const top = rs.scrollEl.getBoundingClientRect().top;
  let cur = 1;
  for (const c of rs.canvases) {
    if (c.getBoundingClientRect().top - top <= 30) cur = c._pageNum;
  }
  return cur;
}

// 捏合缩放（M7）：双指 pinch 直接设目标 zoom（初始 zoom × 距离比），rAF 节流避免频繁重渲染
function pinchDist(t) {
  const dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY;
  return Math.hypot(dx, dy);
}
let pinchRaf = null, pinchTarget = null;
function onReaderTouchStart(e) {
  const rs = readerState;
  if (!rs || !rs.ready) return;
  if (e.touches.length === 2) {
    // M7：不 preventDefault（passive:true），靠 .reader-scroll 的 touch-action:pan-x pan-y
    // 阻止浏览器原生 pinch-zoom；passive:true 避免干扰 iOS 长按选词手势识别（放大镜不弹的元凶）
    rs._pinching = true;
    rs._pinchInitialDist = pinchDist(e.touches);
    rs._pinchInitialZoom = rs.zoom;
  }
}
function onReaderTouchMove(e) {
  const rs = readerState;
  if (!rs || !rs._pinching || e.touches.length !== 2) return;
  // M7：不 preventDefault（passive:true），靠 touch-action:pan-x pan-y 阻止浏览器 pinch-zoom
  if (rs._pinchInitialDist > 0) {
    pinchTarget = rs._pinchInitialZoom * (pinchDist(e.touches) / rs._pinchInitialDist);
    if (!pinchRaf) pinchRaf = requestAnimationFrame(() => { pinchRaf = null; readerZoom(undefined, pinchTarget); });
  }
}
function onReaderTouchEnd(e) {
  const rs = readerState;
  if (!rs) return;
  if (e.touches.length < 2) rs._pinching = false;
}

function onReaderScroll() {
  const rs = readerState;
  if (!rs || !rs.ready) return;
  const st = rs.scrollEl.scrollTop;
  const sh = rs.scrollEl.scrollHeight - rs.scrollEl.clientHeight;
  const frac = sh > 0 ? st / sh : 0;
  const cur = currentReaderPage();
  document.getElementById('reader-pageinfo').textContent = cur + ' / ' + rs.numPages;
  document.getElementById('reader-progress-fill').style.width = (Math.max(0, Math.min(1, frac)) * 100) + '%';
  if (rs.saveTimer) clearTimeout(rs.saveTimer);
  rs.saveTimer = setTimeout(() => saveReaderProgress(frac), 500);
  trHidePopup(); // v2：滚动即收起 ZH 浮层（浮层 fixed 定位不随内容滚）
  if (rs.tr && rs.tr.enabled) trRenderStatus(); // v2：刷新当前页 matched 率
}

async function saveReaderProgress(frac) {
  const rs = readerState;
  if (!rs || !rs.paper) return;
  try {
    const p = rs.paper;
    p.read_progress = Math.max(0, Math.min(1, frac));
    p.updated_at = nowISO();
    await dbPut(p);
  } catch (e) { console.warn('保存进度失败', e); }
}

function restoreReaderProgress() {
  const rs = readerState;
  const frac = (rs.paper && typeof rs.paper.read_progress === 'number') ? rs.paper.read_progress : 0;
  requestAnimationFrame(() => {
    const sh = rs.scrollEl.scrollHeight - rs.scrollEl.clientHeight;
    rs.scrollEl.scrollTop = frac * sh;
    onReaderScroll();
  });
}

// 跳到指定页（批注汇总点击用，M4）
function scrollToPage(pageNum) {
  const rs = readerState;
  if (!rs) return;
  const canvas = rs.canvases.find((c) => c._pageNum === pageNum);
  if (canvas && canvas.parentElement && canvas.parentElement.scrollIntoView) {
    canvas.parentElement.scrollIntoView({ block: 'start' });
  }
  onReaderScroll();
}

function readerZoom(delta, targetZoom) {
  const rs = readerState;
  if (!rs || !rs.ready) return;
  // targetZoom 优先（捏合手势直接设目标倍数），否则按 delta 乘当前 zoom
  rs.zoom = targetZoom !== undefined
    ? Math.max(0.5, Math.min(4, targetZoom))
    : Math.max(0.5, Math.min(4, rs.zoom * delta));
  const scale = rs.baseScale * rs.zoom;
  const prevFrac = rs.scrollEl.scrollHeight > rs.scrollEl.clientHeight
    ? rs.scrollEl.scrollTop / (rs.scrollEl.scrollHeight - rs.scrollEl.clientHeight) : 0;
  for (const c of rs.canvases) {
    const vpCss = c._page.getViewport({ scale });
    c.style.width = Math.round(vpCss.width) + 'px';
    c.style.height = Math.round(vpCss.height) + 'px';
    if (c.parentElement) c.parentElement.style.width = Math.round(vpCss.width) + 'px'; // M7：同步 page 宽，水平滚动范围正确
    c._renderedScale = 0; // 失效，触发重渲染
    c._tlScale = 0;       // textLayer 也失效，重建后重新应用高亮（M4）
  }
  requestAnimationFrame(() => {
    const sh = rs.scrollEl.scrollHeight - rs.scrollEl.clientHeight;
    rs.scrollEl.scrollTop = prevFrac * sh;
    const vh = window.innerHeight;
    for (const c of rs.canvases) {
      const r = c.getBoundingClientRect();
      if (r.bottom > 0 && r.top < vh) renderPage(c);
    }
  });
}

function closeReader() {
  const rs = readerState;
  if (rs) {
    if (rs.saveTimer) { clearTimeout(rs.saveTimer); saveReaderProgressNow(); }
    if (rs.io) rs.io.disconnect();
    // 取消所有 textLayer（M4）
    for (const k in rs.textLayers) {
      try { rs.textLayers[k].layer.cancel(); } catch (e) { /* ignore */ }
    }
    trCancel(); // v2：取消未完成预译
    trHideAll(); // v2：清叠层 + ZH 浮层 DOM
    if (rs.loadingTask) { try { rs.loadingTask.destroy(); } catch (e) { /* ignore */ } }
    if (rs.scrollEl) {
      rs.scrollEl.removeEventListener('scroll', onReaderScroll);
      document.removeEventListener('selectionchange', onReaderSelectionChange);
      document.removeEventListener('pointerdown', onReaderPointerDown);
      document.removeEventListener('pointerup', onReaderPointerUp);
      window.removeEventListener('blur', onReaderWinBlur);
      document.removeEventListener('keyup', onReaderKeyUp);
      rs.scrollEl.removeEventListener('click', onReaderClick);
      rs.scrollEl.removeEventListener('touchstart', onReaderTouchStart);
      rs.scrollEl.removeEventListener('touchmove', onReaderTouchMove);
      rs.scrollEl.removeEventListener('touchend', onReaderTouchEnd);
    }
  }
  hideHlMenu();
  document.getElementById('reader-notes').style.display = 'none';
  document.getElementById('reader').classList.remove('show');
  readerState = null;
  render(); // 刷新列表（read_progress / notes 已写回）
}

function saveReaderProgressNow() {
  const rs = readerState;
  if (!rs || !rs.paper) return;
  const sh = rs.scrollEl.scrollHeight - rs.scrollEl.clientHeight;
  const frac = sh > 0 ? rs.scrollEl.scrollTop / sh : 0;
  const p = rs.paper;
  p.read_progress = Math.max(0, Math.min(1, frac));
  p.updated_at = nowISO();
  dbPut(p).catch(() => {});
}

// toast（v2 翻译反馈用；复用主题变量，Task7 精修样式）
let toastTimer = null;
function toast(msg, ms) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--surface-2);color:var(--text);border:1px solid var(--border);padding:10px 16px;border-radius:10px;font-size:14px;z-index:10000;max-width:80vw;box-shadow:0 6px 20px rgba(0,0,0,0.45);display:none';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, ms || 3000);
}

// ===== v2 翻译：阅读器正文翻译（开关 + streamTextContent 聚合 + 整篇预译 + source_hash 缓存）=====
// 依计划书 §11.5/§11.7。开关 opt-in；开则后台逐页顺序预译（避速率风险），page1 先译好可立刻点；
// 每页 source_hash（该页 textLayer 文本 SHA-256）命中缓存则零调用；关开关/关阅读器取消 pending。
// 展示（点句叠层）由 Task6 实现，本节通过 trApplyPage/trHideAll/trApplyError 钩子调用。

// 缓存版本：拼进 source_hash（sha256(TR_CACHE_VERSION + text)）。空串=初始版，与既有缓存 sha256(text) 兼容；
// 改 Edge Function 的 SYSTEM_PROMPT / DEEPSEEK_MODEL 时同步 bump（'v2'/'v3'...），旧缓存 hash 不符自动失效重译。
const TR_CACHE_VERSION = 'ctx1'; // bump: 加跨页上下文 <ctx_*> + 分块翻译，旧缓存 hash 不符自动失效重译

// 分块上限：2000 时 body 含 ctx 标记可达 2100+，偶发 546（p3 chunk1 2132 失败/p2 2118 成功，DeepSeek 响应波动），1500 更稳
const TR_CHUNK_SIZE = 1500;

// 把页文本按段落+句号切成 <= maxChunk 的块，每块独立调代理（避整页超时）；以句边界切，不切断句
function trSplitText(text, maxChunk) {
  if (!text) return [];
  if (text.length <= maxChunk) return [text];
  const chunks = [];
  const flush = (s) => { if (s && s.trim()) chunks.push(s); };
  const paras = text.split(/\n{2,}/); // 段落（双换行）
  let cur = '';
  for (const p of paras) {
    const cand = cur ? cur + '\n\n' + p : p;
    if (cand.length <= maxChunk) { cur = cand; continue; }
    flush(cur); cur = '';
    if (p.length <= maxChunk) { cur = p; continue; }
    // 单段超长：按句号切
    const sents = p.split(/(?<=[.!?;])\s+/);
    let sc = '';
    for (const s of sents) {
      const cand2 = sc ? sc + ' ' + s : s;
      if (cand2.length <= maxChunk) { sc = cand2; continue; }
      flush(sc); sc = '';
      if (s.length <= maxChunk) { sc = s; continue; }
      // 单句超长（罕见）：硬切
      for (let i = 0; i < s.length; i += maxChunk) flush(s.slice(i, i + maxChunk));
    }
    flush(sc);
  }
  flush(cur);
  return chunks;
}

// 取相邻页上下文（跨页句辅助）：dir='tail' 末尾 1-2 句，'head' 开头 1-2 句。供 DeepSeek 理解跨页句语义
async function trGetCtx(pageNum, dir) {
  try {
    const text = await trExtractPageText(pageNum);
    if (!text || !text.trim()) return '';
    const sents = text.split(/(?<=[.!?;])\s+/).filter((s) => s.trim());
    if (!sents.length) return '';
    const picked = dir === 'tail' ? sents.slice(-2) : sents.slice(0, 2);
    return picked.join(' ').slice(0, 600); // 限长防 ctx 过大
  } catch { return ''; }
}

// 取某页 textLayer 全文（复用 textContentCache；无则 streamTextContent 聚合，iOS 兼容见 aggregateTextContentStream）
async function trExtractPageText(pageNum) {
  const rs = readerState;
  if (!rs || !rs.pdf) return '';
  let tc = rs.textContentCache[pageNum];
  if (!tc) {
    const page = await rs.pdf.getPage(pageNum);
    const stream = page.streamTextContent({ includeMarkedContent: true, disableNormalization: false });
    tc = await aggregateTextContentStream(stream);
    rs.textContentCache[pageNum] = tc;
  }
  // items 拼成页全文：str 按序拼接，hasEOL 处换行（贴近 textLayer 可见文本流，供 LLM 切句 + Task6 偏移匹配）
  let s = '';
  for (const it of tc.items || []) {
    if (typeof it.str !== 'string') continue; // 跳过 markedContent 标记（无文本）
    s += it.str;
    s += it.hasEOL ? '\n' : '';
  }
  return s;
}

// SHA-256 hex（crypto.subtle，需 secure context；GitHub Pages HTTPS / localhost 均可）
async function sha256Hex(text) {
  const buf = new TextEncoder().encode(text);
  const hash = await crypto.subtle.digest('SHA-256', buf);
  return Array.from(new Uint8Array(hash)).map((b) => b.toString(16).padStart(2, '0')).join('');
}

// 单次调 translate-proxy（带 JWT；sbFetch 自动 401 刷新）。text 可含 <ctx_*> 上下文标记
// 504/546/502（DeepSeek 偶发慢导致网关超时，非长度）递增 backoff 重试 3 次（2s/4s/6s，等 DeepSeek 恢复）；
// 其他错误（401/400/429）不重试直接抛
async function trCallProxySingle(text) {
  const s = sbSession();
  if (!s) throw new Error('未登录');
  const headers = sbHeaders(s.access_token);
  headers['Content-Type'] = 'application/json';
  const url = SUPABASE_URL + '/functions/v1/translate-proxy';
  const body = JSON.stringify({ text });
  let lastErr = null;
  for (let attempt = 0; attempt < 4; attempt++) { // 首调 + 3 retry
    const rs = readerState;
    if (rs && rs.tr && (rs.tr.cancelled || !rs.tr.enabled)) throw new Error('已取消');
    let res;
    try { res = await sbFetch(url, { method: 'POST', headers, body }); }
    catch (e) { // fetch 网络层抛错，retry
      lastErr = e;
      if (attempt < 3) { await new Promise((r) => setTimeout(r, 2000 * (attempt + 1))); continue; }
      throw e;
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* ignore */ }
    if (res.ok) {
      if (data && Array.isArray(data.sentences)) return data.sentences;
      throw new Error('翻译返回格式异常'); // 格式错不重试
    }
    const retryable = res.status === 504 || res.status === 546 || res.status === 502;
    lastErr = new Error((data && data.error) || ('翻译失败 (' + res.status + ')'));
    if (retryable && attempt < 3) {
      const backoff = 2000 * (attempt + 1); // 2s, 4s, 6s
      console.log('[tr] chunk 状态 ' + res.status + '，' + (backoff / 1000) + 's 后重试 (' + (attempt + 1) + '/3)');
      await new Promise((r) => setTimeout(r, backoff));
      continue;
    }
    throw lastErr;
  }
  throw lastErr || new Error('翻译失败');
}

// 翻译整页文本：分块（避超时 504）+ 跨页上下文（首块带 prevCtx、末块带 nextCtx，<ctx_*> 标记供 Edge Function 识别只译 <page>）
async function trCallProxy(text, opts) {
  const rs = readerState;
  const prevCtx = opts && opts.prevCtx;
  const nextCtx = opts && opts.nextCtx;
  const chunks = trSplitText(text, TR_CHUNK_SIZE);
  if (chunks.length === 0) return [];
  const all = [];
  for (let i = 0; i < chunks.length; i++) {
    if (rs && rs.tr && (rs.tr.cancelled || !rs.tr.enabled)) throw new Error('已取消');
    let body = chunks[i];
    if (i === 0 && prevCtx) body = '<ctx_prev>' + prevCtx + '</ctx_prev>\n' + body;
    if (i === chunks.length - 1 && nextCtx) body += '\n<ctx_next>' + nextCtx + '</ctx_next>';
    console.log('[tr] chunk ' + (i + 1) + '/' + chunks.length, 'len=' + body.length);
    let pairs;
    try { pairs = await trCallProxySingle(body); }
    catch (e) { console.log('[tr] chunk ' + (i + 1) + ' 失败:', e.message); throw e; }
    if (Array.isArray(pairs)) all.push(...pairs);
  }
  return all;
}

// 翻译状态文本（顶栏 "翻译中 n/m" / "译文就绪 N 页"）
function trRenderStatus() {
  const rs = readerState;
  const btn = document.getElementById('reader-translate-btn');
  const st = document.getElementById('reader-tr-status');
  if (!btn || !st) return;
  if (!rs || !rs.tr || !rs.tr.enabled) {
    btn.setAttribute('aria-pressed', 'false');
    st.textContent = (rs && rs.tr && rs.tr.keyMissing) ? '需先设置 DeepSeek key' : '';
    return;
  }
  btn.setAttribute('aria-pressed', 'true');
  const tr = rs.tr;
  const done = tr.done >= tr.total && tr.total > 0;
  const failed = tr.failed || 0;
  let txt = done ? ('译文就绪 ' + tr.total + ' 页') : ((tr.finished ? '部分就绪 ' : '翻译中 ') + tr.done + '/' + tr.total);
  if (failed > 0) txt += '（失败 ' + failed + ' 页）';
  // 整篇就绪时附当前页匹配率（漏句可见；可点重译）
  if (done) {
    const cur = currentReaderPage();
    const pg = cur && tr.pages[cur];
    if (pg && pg.ready && Array.isArray(pg.pairs) && pg.pairs.length) {
      const m = (pg.matched != null) ? pg.matched : 0;
      txt += ' · 本页 ' + m + '/' + pg.pairs.length;
      if (m < pg.pairs.length) txt += '（点此重译）';
    }
  }
  st.textContent = txt;
  st.style.cursor = done ? 'pointer' : 'default';
}

// 确保某页有 pairs：缓存命中（source_hash 一致）直接用；否则提取文本->调代理->存缓存
async function trEnsurePairs(pageNum) {
  const rs = readerState;
  if (!rs || !rs.tr || rs.tr.cancelled) return null;
  const tr = rs.tr;
  const paperId = rs.paper.id;
  const userId = sbSession() && sbSession().user && sbSession().user.id;
  const cached = await dbGetTranslation(paperId, pageNum).catch(() => null);
  const text = await trExtractPageText(pageNum);
  const hash = await sha256Hex(TR_CACHE_VERSION + text);
  console.log('[tr] p' + pageNum, 'cached=' + !!cached, 'cHash=' + (cached && cached.source_hash || '').slice(0,12), 'nHash=' + hash.slice(0,12), 'match=' + (cached && cached.source_hash === hash), 'textLen=' + text.length);
  if (cached && cached.source_hash === hash && Array.isArray(cached.pairs)) {
    // 命中缓存（含空页空 pairs 占位）零调用；pairs 可能空（空页）但 hash 一致即视为有效
    tr.pages[pageNum] = { pairs: cached.pairs, ready: true, status: 'ready' };
    return { pairs: cached.pairs, fromCache: true };
  }
  // 空页（纯图/封面）：无文本可译，存空 pairs 占位避免反复调代理
  if (!text.trim()) {
    const pairs = [];
    await dbPutTranslation({ id: (cached && cached.id) || uid(), user_id: userId, paper_id: paperId, page_num: pageNum, pairs, source_hash: hash });
    console.log('[tr] p' + pageNum, '空页存空占位');
    tr.pages[pageNum] = { pairs, ready: true, status: 'ready' };
    return { pairs, fromCache: false };
  }
  tr.pages[pageNum] = Object.assign(tr.pages[pageNum] || {}, { status: 'translating' });
  trRenderStatus();
  // 跨页上下文：前页末尾 + 后页开头，让 DeepSeek 理解跨页句（只译本页 <page>，ctx 不译）
  const prevCtx = pageNum > 1 ? await trGetCtx(pageNum - 1, 'tail') : '';
  const nextCtx = pageNum < rs.numPages ? await trGetCtx(pageNum + 1, 'head') : '';
  const pairs = await trCallProxy(text, { prevCtx, nextCtx });
  console.log('[tr] p' + pageNum, '代理返回 pairs=' + (pairs ? pairs.length : 'null'));
  if (!rs.tr || rs.tr.cancelled) return null; // 调用期间被取消
  await dbPutTranslation({ id: (cached && cached.id) || uid(), user_id: userId, paper_id: paperId, page_num: pageNum, pairs, source_hash: hash });
  console.log('[tr] p' + pageNum, 'dbPut 成功');
  tr.pages[pageNum] = { pairs, ready: true, status: 'ready' };
  return { pairs, fromCache: false };
}

// 重译本页（用户点状态栏触发）：绕过缓存命中检查，强制重调代理拿新 pairs 覆盖
async function trRetranslatePage(pageNum) {
  const rs = readerState;
  if (!rs || !rs.tr || rs.tr.cancelled) return;
  const tr = rs.tr;
  const paperId = rs.paper.id;
  const userId = sbSession() && sbSession().user && sbSession().user.id;
  const tl = rs.textLayers && rs.textLayers[pageNum];
  if (tl) trUnwrapPage(tl.container);
  tr.pages[pageNum] = Object.assign(tr.pages[pageNum] || {}, { ready: false, status: 'translating', matched: 0 });
  trRenderStatus();
  const text = await trExtractPageText(pageNum);
  const hash = await sha256Hex(TR_CACHE_VERSION + text);
  let pairs = [];
  if (text.trim()) {
    const prevCtx = pageNum > 1 ? await trGetCtx(pageNum - 1, 'tail') : '';
    const nextCtx = pageNum < rs.numPages ? await trGetCtx(pageNum + 1, 'head') : '';
    try { pairs = await trCallProxy(text, { prevCtx, nextCtx }); }
    catch (e) { trApplyError('重译失败：' + ((e && e.message) || e)); tr.pages[pageNum].status = 'error'; trRenderStatus(); return; }
    if (!rs.tr || rs.tr.cancelled) return;
  }
  const cached = await dbGetTranslation(paperId, pageNum).catch(() => null);
  await dbPutTranslation({ id: (cached && cached.id) || uid(), user_id: userId, paper_id: paperId, page_num: pageNum, pairs, source_hash: hash });
  tr.pages[pageNum] = { pairs, ready: true, status: 'ready' };
  trApplyPage(pageNum);
  trRenderStatus();
}

// 整篇顺序预译：page1 先译好可立刻点，后续排队；顺序执行避 DeepSeek 速率风险
async function trPretranslateLoop() {
  const rs = readerState;
  if (!rs || !rs.tr) return;
  const tr = rs.tr;
  tr.total = rs.numPages;
  tr.done = 0;
  tr.failed = 0;
  tr.finished = false;
  trRenderStatus();
  for (let i = 1; i <= rs.numPages; i++) {
    if (tr.cancelled || !tr.enabled) break;
    try {
      const r = await trEnsurePairs(i);
      if (r) { tr.done++; trRenderStatus(); trApplyPage(i); } // done 计成功数（失败不计，状态栏不再假"译完"）
    } catch (e) {
      const msg = e && e.message ? e.message : String(e);
      console.log('[tr] p' + i, '失败:', msg);
      tr.pages[i] = { pairs: [], ready: false, status: 'error', error: msg };
      tr.failed = (tr.failed || 0) + 1; // 修A：失败不计入 done，状态栏不再假"译完"
      trRenderStatus();
      // key 无效/未设置/未登录：后续都会失败，停整篇预译
      if (/未设置|key 无效|未登录/.test(msg)) { tr.keyMissing = /未设置|未登录/.test(msg); trApplyError(msg); break; }
      trApplyError('第 ' + i + ' 页翻译失败：' + msg);
    }
  }
  if (!tr.cancelled && tr.enabled) { tr.finished = true; trRenderStatus(); }
}

// 开关（opt-in；读英文论文不花钱）
async function toggleTranslate(forceState) {
  const rs = readerState;
  if (!rs || !rs.ready) return;
  const turnOn = forceState != null ? forceState : !(rs.tr && rs.tr.enabled);
  if (turnOn) {
    if (!navigator.onLine) { toast('翻译需联网'); return; }
    if (!sbSession()) { toast('翻译需登录'); return; }
    rs.tr = rs.tr || { enabled: false, pages: {}, done: 0, total: rs.numPages, cancelled: false };
    rs.tr.enabled = true;
    rs.tr.cancelled = false;
    rs.tr.keyMissing = false;
    rs.tr.failed = 0;
    rs.tr.finished = false;
    rs.tr.pages = rs.tr.pages || {};
    trRenderStatus();
    await trPretranslateLoop();
  } else {
    if (rs.tr) { rs.tr.enabled = false; rs.tr.cancelled = true; }
    trHideAll(); // Task6 隐藏叠层 + ZH 浮层
    trRenderStatus();
  }
}

// 关阅读器/关开关时取消 pending 预译
function trCancel() {
  const rs = readerState;
  if (rs && rs.tr) { rs.tr.cancelled = true; rs.tr.enabled = false; }
}

// ===== Task6：点句叠层 + ZH 浮层（句子偏移 -> span 映射，复用 M4 TreeWalker 偏移机制）=====
// trApplyPage(pageNum)：该页 pairs 就绪后，把每句 en 在 textLayer 里定位 [start,end) 字符偏移，
//   包成 <span class="tr-sent" data-pair="i"> 片段（同句跨多个 textLayer span 则多片段，共享 data-pair）。
//   匹配失败的句降级为不可点（不崩，§11.6）。点句弹 ZH 浮层（仅译文，§11.10）。
// 偏移基准：textLayer live 文本 = 各 span 文本节点拼接（<br> 无文本）；与 trExtractPageText 喂 LLM 的
//   items 文本唯一差异是 hasEOL 处的 \n（live 无 \n）。故 en 去 \n 后通常能直接 indexOf 命中。

// 取某页 textLayer 的 live 文本 + 归一化映射（空白折叠，兜底匹配用）
function trBuildTextMap(pageNum) {
  const rs = readerState;
  const tl = rs && rs.textLayers && rs.textLayers[pageNum];
  if (!tl) return null;
  const walker = document.createTreeWalker(tl.container, NodeFilter.SHOW_TEXT);
  let raw = '';
  while (walker.nextNode()) raw += walker.currentNode.nodeValue;
  if (!raw) return null;
  // 归一化：空白 runs 折叠为单空格，记每个 norm 字符对应的 raw 起始偏移
  let norm = '';
  const rawStart = [];
  const isWs = (c) => c === ' ' || c === '\n' || c === '\t' || c === '\r' || c === '\f' || c === '\v';
  let i = 0;
  while (i < raw.length) {
    if (isWs(raw[i])) {
      norm += ' '; rawStart.push(i);
      while (i < raw.length && isWs(raw[i])) i++;
    } else {
      norm += raw[i]; rawStart.push(i); i++;
    }
  }
  // level4 用：去全部空白 + 每个 noWs 字符对应的 raw 偏移
  // 解决行界错配--trExtractPageText 在 hasEOL 处插 \n 喂 LLM，LLM 可能把 \n 规范化成空格返回 en，
  // 而 live 文本（raw）行界处无空格；前 3 级匹配都过不了，去全部空白才能匹上。
  let noWs = '';
  const noWsToRaw = [];
  for (let j = 0; j < raw.length; j++) {
    if (isWs(raw[j])) continue;
    noWs += raw[j];
    noWsToRaw.push(j);
  }
  // level5 用：折叠字符级差异（弯直引号/dash 归一 + 去断词连字符 + 去空白）+ 每个 fold 字符对应的 raw 偏移
  // 救 DeepSeek 字符级 verbatim 漂移：断词 knowl-\nedge->knowledge、弯引号 ‘->' 、dash –->- （5 agent 实测 15-20% 漏句主因）
  const FOLD = { '‘':"'", '’':"'", '‚':"'", '‛':"'", '“':'"', '”':'"', '„':'"', '‟':'"', '–':'-', '—':'-', '−':'-' };
  let fold = '';
  const foldToRaw = [];
  for (let j = 0; j < raw.length; j++) {
    if (isWs(raw[j])) continue;
    const ch = FOLD[raw[j]] || raw[j];
    // 词中连字符（归一后是 -，fold 串前一字符 + raw 下一非空白字符均为字母）：去掉
    // 救断词 knowl-edge->knowledge 与正常 well-known->wellknown 统一处理（DeepSeek 常还原无连字符）
    if (ch === '-' && fold.length > 0 && /[a-zA-Z]/.test(fold[fold.length - 1])) {
      let n = j + 1; while (n < raw.length && isWs(raw[n])) n++;
      if (n < raw.length && /[a-zA-Z]/.test(raw[n])) continue;
    }
    fold += ch;
    foldToRaw.push(j);
  }
  return { raw, norm, rawStart, noWs, noWsToRaw, fold, foldToRaw };
}

// level5 折叠：与 map.fold 构造一致（弯引号/dash 归一 + 去空白 + 词中连字符去除）
function trFoldStr(s) {
  if (!s) return '';
  return s
    .replace(/[‘’‚‛]/g, "'")
    .replace(/[“”„‟]/g, '"')
    .replace(/[–-−]/g, '-')
    .replace(/\s+/g, '')
    .replace(/([a-zA-Z])-(?=[a-zA-Z])/g, '$1');
}

// 在 map.raw 里从 fromPos 起找 en 句的 [start,end)。三级匹配：原样 -> 去 \n -> 归一化空白
function trFindOffset(map, en, fromPos) {
  if (!map || !en) return null;
  let idx = map.raw.indexOf(en, fromPos);
  if (idx >= 0) return { start: idx, end: idx + en.length };
  // live 文本无 \n（<br> 无文本），en 跨行处的 \n 去掉再匹配
  const enNonl = en.replace(/\n/g, '');
  if (enNonl) {
    idx = map.raw.indexOf(enNonl, fromPos);
    if (idx >= 0) return { start: idx, end: idx + enNonl.length };
  }
  // 兜底：归一化空白匹配（en 与 live 间有空格差异）
  const enNorm = en.replace(/\s+/g, ' ').trim();
  if (enNorm) {
    // level-3 也要传 fromPos（换算成 norm 下标）；否则页内重复文本会匹到更早位置 + pos 倒退连锁（3 agent 共识 bug）
    let fromNorm = 0;
    while (fromNorm < map.rawStart.length && map.rawStart[fromNorm] < fromPos) fromNorm++;
    const nPos = map.norm.indexOf(enNorm, fromNorm);
    if (nPos >= 0) {
      const start = map.rawStart[nPos];
      const end = (map.rawStart[nPos + enNorm.length - 1] || start) + 1;
      return { start, end };
    }
  }
  // level4 兜底：去全部空白匹配（en 行界带空格、live 行界无空格时前 3 级都失败）
  const enNoWs = en.replace(/\s+/g, '');
  if (enNoWs && map.noWs) {
    let fromNo = 0;
    while (fromNo < map.noWsToRaw.length && map.noWsToRaw[fromNo] < fromPos) fromNo++;
    const n = map.noWs.indexOf(enNoWs, fromNo);
    if (n >= 0) {
      const endNo = n + enNoWs.length - 1;
      if (endNo < map.noWsToRaw.length) {
        return { start: map.noWsToRaw[n], end: map.noWsToRaw[endNo] + 1 };
      }
    }
  }
  // level5 兜底：折叠字符级差异匹配（弯直引号/dash/断词连字符；5 agent 实测 15-20% 漏句主因）
  const enFold = trFoldStr(en);
  if (enFold && map.fold) {
    let fromFold = 0;
    while (fromFold < map.foldToRaw.length && map.foldToRaw[fromFold] < fromPos) fromFold++;
    const f = map.fold.indexOf(enFold, fromFold);
    if (f >= 0) {
      const endF = f + enFold.length - 1;
      if (endF < map.foldToRaw.length) {
        return { start: map.foldToRaw[f], end: map.foldToRaw[endF] + 1 };
      }
    }
  }
  return null;
}

// 把 [start,end) 包成 tr-sent 片段（同 M4 wrapTextRange 的 TreeWalker 分段，但用 span + data-pair，
// 留在各自 textLayer span 内继承 inline font-size/transform）
function trWrapSentence(pageEl, start, end, pairIdx) {
  if (end <= start) return false;
  const walker = document.createTreeWalker(pageEl, NodeFilter.SHOW_TEXT);
  const segs = [];
  let cur = 0, node;
  while ((node = walker.nextNode())) {
    const len = node.nodeValue.length;
    if (cur + len <= start) { cur += len; continue; }
    if (cur >= end) break;
    segs.push({ node, localStart: Math.max(0, start - cur), localEnd: Math.min(len, end - cur) });
    cur += len;
  }
  if (!segs.length) return false;
  let any = false;
  for (const s of segs) {
    if (s.localEnd <= s.localStart) continue;
    const range = document.createRange();
    range.setStart(s.node, s.localStart);
    range.setEnd(s.node, s.localEnd);
    const span = document.createElement('span');
    span.className = 'tr-sent';
    span.dataset.pair = String(pairIdx);
    try { range.surroundContents(span); any = true; }
    catch (e) {
      try { const frag = range.extractContents(); span.appendChild(frag); range.insertNode(span); any = true; }
      catch (e2) { /* 跳过该段 */ }
    }
  }
  return any;
}

// 清某 pageEl 内所有 tr-sent 片段（unwrap，还原文本）
function trUnwrapPage(pageEl) {
  if (!pageEl) return;
  pageEl.querySelectorAll('span.tr-sent').forEach((sp) => {
    const parent = sp.parentNode;
    while (sp.firstChild) parent.insertBefore(sp.firstChild, sp);
    parent.removeChild(sp);
    parent.normalize();
  });
  pageEl.querySelectorAll('.tr-underline-layer').forEach((l) => l.remove());
}

// 应用某页译文叠层（pairs 就绪后调；缩放重建 textLayer 后也调）
function trApplyPage(pageNum) {
  const rs = readerState;
  if (!rs || !rs.tr || !rs.tr.enabled) return;
  const pg = rs.tr.pages[pageNum];
  if (!pg || !pg.ready || !Array.isArray(pg.pairs) || !pg.pairs.length) return;
  const tl = rs.textLayers && rs.textLayers[pageNum];
  if (!tl) return; // 该页 textLayer 未渲染（懒渲染：滚到才画）；之后 renderPage 会补调
  const pageEl = tl.container;
  trUnwrapPage(pageEl); // 清旧（重译/重铺）
  const map = trBuildTextMap(pageNum);
  if (!map) return;
  let pos = 0, matched = 0;
  for (let i = 0; i < pg.pairs.length; i++) {
    const en = pg.pairs[i] && pg.pairs[i].en;
    const found = trFindOffset(map, en, pos);
    if (found && found.start >= pos) { trWrapSentence(pageEl, found.start, found.end, i); pos = found.end; matched++; }
    // 匹配失败/倒退：该句不可点，pos 不动（下一句从同位置继续找）；found.start<pos 视为失败防 pos 倒退
  }
  pg.matched = matched;
  trPaintUnderlines(pageEl);
}

// 画句内连续底线（overlay）：pdf.js 每词一 span，tr-sent 片段间有词间 gap，
// border-bottom 会断续；改在 textLayer 上叠绝对定位层，按 data-pair 分组每行画一条 1px 线覆盖 gap。
// layer insertBefore(endOfContent) 保持 endOfContent=lastChild（M7 reset 依赖）；reset 的 append(endOfContent) 也会自动维持顺序。
function trPaintUnderlines(pageEl) {
  if (!pageEl) return;
  pageEl.querySelectorAll('.tr-underline-layer').forEach((l) => l.remove());
  const sents = pageEl.querySelectorAll('span.tr-sent');
  if (!sents.length) return;
  const endOf = pageEl.querySelector('.endOfContent');
  const layer = document.createElement('div');
  layer.className = 'tr-underline-layer';
  pageEl.insertBefore(layer, endOf); // endOf 为 null 时等价 appendChild
  const cRect = pageEl.getBoundingClientRect();
  const groups = new Map();
  sents.forEach((s) => {
    const k = s.dataset.pair;
    if (!groups.has(k)) groups.set(k, []);
    const r = s.getBoundingClientRect();
    groups.get(k).push({ x: r.left - cRect.left, y: r.top - cRect.top, w: r.width, h: r.height });
  });
  for (const [k, rects] of groups) {
    if (!rects.length) continue;
    rects.sort((a, b) => a.y - b.y || a.x - b.x);
    const rows = [];
    for (const r of rects) {
      const last = rows[rows.length - 1];
      if (last && Math.abs(r.y - last.y) < 3) {
        last.segs.push(r);
        last.minX = Math.min(last.minX, r.x);
        last.maxEnd = Math.max(last.maxEnd, r.x + r.w);
        last.y = Math.min(last.y, r.y);
        last.h = Math.max(last.h, r.h);
      } else {
        rows.push({ y: r.y, h: r.h, minX: r.x, maxEnd: r.x + r.w, segs: [r] });
      }
    }
    for (const row of rows) {
      const ul = document.createElement('div');
      ul.className = 'tr-underline';
      ul.dataset.pair = k;
      ul.style.left = row.minX + 'px';
      ul.style.top = (row.y + row.h - 1) + 'px';
      ul.style.width = (row.maxEnd - row.minX) + 'px';
      layer.appendChild(ul);
    }
    // P2：句尾图标 -- 末行右端外侧放书页角小图标，单击弹该句译文（绕开 textLayer 选词冲突）
    const lastRow = rows[rows.length - 1];
    const icon = document.createElement('div');
    icon.className = 'tr-icon';
    icon.dataset.pair = k;
    icon.title = '查看译文';
    icon.style.left = (lastRow.maxEnd + 2) + 'px';
    icon.style.top = (lastRow.y + lastRow.h / 2 - 7) + 'px';
    icon.innerHTML = '<svg viewBox="0 0 14 14"><path d="M3 2 H9 L11 4 V12 H3 Z"/><path d="M9 2 V4 H11"/></svg>';
    layer.appendChild(icon);
  }
}

// 隐藏所有译文叠层 + ZH 浮层（关开关 / 关阅读器）
function trHideAll() {
  const rs = readerState;
  if (rs && rs.textLayers) {
    for (const k in rs.textLayers) trUnwrapPage(rs.textLayers[k].container);
  }
  trHidePopup();
}

function trApplyError(msg) { toast(msg, 4000); }

// ---- ZH 浮层（仅译文）----
let trActivePair = null; // { pageNum, idx }
function trHidePopup() {
  const pop = document.getElementById('reader-tr-popup');
  if (pop) pop.style.display = 'none';
  if (trActivePair && readerState && readerState.textLayers) {
    const tl = readerState.textLayers[trActivePair.pageNum];
    if (tl) {
      tl.container.querySelectorAll('span.tr-sent.tr-active').forEach((s) => s.classList.remove('tr-active'));
      tl.container.querySelectorAll('.tr-underline.tr-active').forEach((s) => s.classList.remove('tr-active'));
      tl.container.querySelectorAll('.tr-icon.tr-icon-active').forEach((s) => s.classList.remove('tr-icon-active'));
    }
  }
  trActivePair = null;
}
function trShowPopup(pageNum, pairIdx, anchorEl) {
  const rs = readerState;
  if (!rs || !rs.tr) return;
  const pg = rs.tr.pages[pageNum];
  if (!pg || !pg.pairs || !pg.pairs[pairIdx]) return;
  const zh = pg.pairs[pairIdx].zh || '';
  const pop = document.getElementById('reader-tr-popup');
  if (!pop) return;
  trHidePopup(); // 清上一处
  pop.textContent = zh;
  pop.style.display = 'block';
  const tl = rs.textLayers && rs.textLayers[pageNum];
  if (tl) {
    tl.container.querySelectorAll('span.tr-sent[data-pair="' + pairIdx + '"]').forEach((s) => s.classList.add('tr-active'));
    tl.container.querySelectorAll('.tr-underline[data-pair="' + pairIdx + '"]').forEach((s) => s.classList.add('tr-active'));
    tl.container.querySelectorAll('.tr-icon[data-pair="' + pairIdx + '"]').forEach((s) => s.classList.add('tr-icon-active'));
  }
  trActivePair = { pageNum, idx: pairIdx };
  // 定位：锚点片段视口矩形下方居中；不够则上方；再夹在视口内
  const r = anchorEl.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  let left = r.left + r.width / 2 - pw / 2;
  let top = r.bottom + 8;
  if (top + ph > window.innerHeight - 8) top = r.top - ph - 8;
  left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
  top = Math.max(8, top);
  pop.style.left = Math.round(left) + 'px';
  pop.style.top = Math.round(top) + 'px';
}

// 点句弹 ZH 浮层（事件委托）；选区展开时让位 M4 高亮菜单
function onReaderTrClick(e) {
  const rs = readerState;
  if (!rs || !rs.tr || !rs.tr.enabled) return;
  // P2：句尾图标承担点击入口，tr-sent 不再弹译文（绕开 textLayer 选词冲突）
  const icon = e.target && e.target.closest ? e.target.closest('.tr-icon') : null;
  if (!icon) { trHidePopup(); return; }
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) return; // 拖选中，让 M4 接管
  let pageNum = null;
  for (const k in rs.textLayers) {
    if (rs.textLayers[k].container.contains(icon)) { pageNum = +k; break; }
  }
  if (pageNum == null) return;
  const pairIdx = +icon.dataset.pair;
  trShowPopup(pageNum, pairIdx, icon);
}


// ===== 高亮批注（M4）=====
// 高亮双色：黄 + 蓝。选中色 ::selection 用 accent 古铜金 rgba(201,169,110)，
// 与蓝色高亮区分开。'blue' 为旧数据兼容，回退到蓝（cyan）。
const HIGHLIGHT_COLORS = { yellow: 'rgba(232,196,106,0.45)', cyan: 'rgba(111,168,212,0.45)' };
let currentHlColor = 'yellow';

// 应用某页全部高亮：先清旧 mark 再按偏移重包（缩放/增删后重画）
function applyHighlights(pageNum) {
  const rs = readerState;
  const tl = rs && rs.textLayers[pageNum];
  if (!tl) return;
  const pageEl = tl.container;
  pageEl.querySelectorAll('mark.hl').forEach((m) => {
    const parent = m.parentNode;
    while (m.firstChild) parent.insertBefore(m.firstChild, m);
    parent.removeChild(m);
    parent.normalize();
  });
  const annos = rs.annos.filter((a) => a.page === pageNum).sort((a, b) => a.start_offset - b.start_offset);
  for (const a of annos) wrapTextRange(pageEl, a.start_offset, a.end_offset, a);
}

// 把 [start,end) 字符范围包进 <mark>。按文本节点分段：每段各自 surroundContents 一个 mark
// （同一 anno 的所有 mark 共享 data-annoId / 颜色 / 批注）。这样每个 mark 都留在各自 span 内，
// 继承 span 的 inline font-size / transform，跨 span / 跨行高亮也能渲染。
// （旧实现跨节点时退回 extractContents+insertNode，会把 mark 插成 .textLayer 直接子节点，
// 拿不到 span 的 inline 字号/变换 -> 视觉不可见。Bug C）
function wrapTextRange(pageEl, start, end, anno) {
  if (end <= start) return false;
  const walker = document.createTreeWalker(pageEl, NodeFilter.SHOW_TEXT);
  const segs = []; // [{node, localStart, localEnd}]，先收齐再包，避免包裹时改 DOM 影响遍历
  let cur = 0, node;
  while ((node = walker.nextNode())) {
    const len = node.nodeValue.length;
    if (cur + len <= start) { cur += len; continue; } // 该文本节点整体在 start 之前
    if (cur >= end) break;                            // 该文本节点整体在 end 之后，后面更后
    segs.push({ node, localStart: Math.max(0, start - cur), localEnd: Math.min(len, end - cur) });
    cur += len;
  }
  if (segs.length === 0) return false;
  let any = false;
  for (const s of segs) {
    if (s.localEnd <= s.localStart) continue;
    const range = document.createRange();
    range.setStart(s.node, s.localStart);
    range.setEnd(s.node, s.localEnd);
    const mark = document.createElement('mark');
    mark.className = 'hl';
    mark.dataset.annoId = anno.id;
    mark.style.backgroundColor = HIGHLIGHT_COLORS[anno.color] || (anno.color === 'blue' ? HIGHLIGHT_COLORS.cyan : HIGHLIGHT_COLORS.yellow);
    if (anno.note) mark.title = anno.note;
    try { range.surroundContents(mark); any = true; }
    catch (e) {
      // 单文本节点内一般不会失败；边界处若已存在 mark 导致部分跨节点，退回 extract+insert
      try { const frag = range.extractContents(); mark.appendChild(frag); range.insertNode(mark); any = true; }
      catch (e2) { /* 跳过该段 */ }
    }
  }
  return any;
}

// 从当前 Selection 算出在 pageEl 文本里的 [start,end) 偏移（用 Range.toString().length）
function captureSelection(pageEl) {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) return null;
  const range = sel.getRangeAt(0);
  // M7 守卫：选区起/终点须在该 pageEl 内，且不是整个容器自身（防 iOS 把 textLayer 当整体选中 -> 整页高亮，
  // 也防选区跨到顶栏 UI 如"笔记"按钮 -> offset 算成整页+UI）
  if (!pageEl.contains(range.startContainer) || !pageEl.contains(range.endContainer)) return null;
  if (range.startContainer === pageEl || range.endContainer === pageEl) return null;
  // M7: 端点落在 endOfContent（Safari 分支挪到 anchor 旁的 user-select:text 屏障）会算出垃圾偏移 -> 整页高亮，放弃
  const eoc = pageEl.querySelector('.endOfContent');
  if (eoc && (eoc === range.startContainer || eoc === range.endContainer ||
              eoc.contains(range.startContainer) || eoc.contains(range.endContainer))) return null;
  const startR = document.createRange();
  startR.selectNodeContents(pageEl);
  startR.setEnd(range.startContainer, range.startOffset);
  const endR = document.createRange();
  endR.selectNodeContents(pageEl);
  endR.setEnd(range.endContainer, range.endOffset);
  let start = startR.toString().length;
  let end = endR.toString().length;
  if (start > end) { const t = start; start = end; end = t; }
  const text = sel.toString();
  if (end <= start || !text || !text.trim()) return null;
  return { start, end, text };
}

let selChangeTimer = null;
let selPrevRange = null; // 官方 prevRange：判断用户在拖选区哪一端（modifyStart）
let readerSelPointerDown = false;

// 官方 TextLayerBuilder.#enableGlobalSelectionListener.reset：把 endOfContent 归位到 textLayer 末尾
// + 清 inline 尺寸 + 移除 .selecting。松手/失焦/keyup 时调用，避免 user-select:none 屏障常驻。
function resetReaderTextLayer(tlInfo) {
  if (!tlInfo || !tlInfo.endOfContent) return;
  tlInfo.container.append(tlInfo.endOfContent);
  tlInfo.endOfContent.style.width = '';
  tlInfo.endOfContent.style.height = '';
  tlInfo.container.classList.remove('selecting');
}
function resetAllReaderTextLayers() {
  const rs = readerState;
  if (!rs) return;
  for (const k in rs.textLayers) resetReaderTextLayer(rs.textLayers[k]);
  selPrevRange = null;
}
function onReaderPointerDown() { readerSelPointerDown = true; }
function onReaderPointerUp() { readerSelPointerDown = false; resetAllReaderTextLayers(); }
function onReaderWinBlur() { readerSelPointerDown = false; resetAllReaderTextLayers(); }
function onReaderKeyUp() { if (!readerSelPointerDown) resetAllReaderTextLayers(); }

function onReaderSelectionChange() {
  const rs = readerState;
  if (!rs) return;
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0) { resetAllReaderTextLayers(); return; }
  // 官方 activeTextLayers：选区相交的 textLayer 加 .selecting，其余 reset
  const active = new Set();
  for (let i = 0; i < sel.rangeCount; i++) {
    const r = sel.getRangeAt(i);
    for (const k in rs.textLayers) {
      const c = rs.textLayers[k].container;
      if (!active.has(c) && r.intersectsNode(c)) active.add(c);
    }
  }
  for (const k in rs.textLayers) {
    const tl = rs.textLayers[k];
    if (active.has(tl.container)) tl.container.classList.add('selecting');
    else resetReaderTextLayer(tl);
  }
  // 官方 Safari 分支：iOS Safari 既非 Firefox 也非 Chromium148+，必走此分支（桌面 Safari 同）。
  // 注释同官方 text_layer_builder.js：Safari 上指针悬到空白处（落到 .endOfContent）时，选区会扩展到
  // 当前选区与 .endOfContent 之间的全部文本；把 .endOfContent 挪到选区 anchor 旁 + 设 userSelect:'text'，
  // 把跳跃限制在当前 span 内。这是"长按直接选整页/选进顶栏笔记"的根因修复（fable 对抗审查 4/5 收敛）。
  // 省略官方 isFirefoxOrModernChromium 判定：所有浏览器都执行此分支，桌面 Firefox/Chromium148+ 多执行
  // 无害挪位（沙箱 27/27 验证不破坏桌面选词），iOS/桌面 Safari 必需。
  try {
    const range = sel.getRangeAt(0);
    const modifyStart = selPrevRange &&
      (range.compareBoundaryPoints(Range.END_TO_END, selPrevRange) === 0 ||
       range.compareBoundaryPoints(Range.START_TO_END, selPrevRange) === 0);
    let anchor = modifyStart ? range.startContainer : range.endContainer;
    if (anchor && anchor.nodeType === Node.TEXT_NODE) anchor = anchor.parentNode;
    if (anchor && anchor.classList && anchor.classList.contains('hl')) anchor = anchor.parentNode;
    if (!modifyStart && range.endOffset === 0) {
      do {
        while (!anchor.previousSibling) anchor = anchor.parentNode;
        anchor = anchor.previousSibling;
      } while (!anchor.childNodes.length);
    }
    if (anchor && anchor.parentElement) {
      const parentTextLayer = anchor.parentElement.closest('.textLayer');
      if (parentTextLayer) {
        const pageNum = Number(parentTextLayer.dataset.pageNum);
        const tlInfo = rs.textLayers[pageNum];
        if (tlInfo && tlInfo.endOfContent) {
          const eoc = tlInfo.endOfContent;
          eoc.style.width = parentTextLayer.style.width;
          eoc.style.height = parentTextLayer.style.height;
          eoc.style.userSelect = 'text';
          anchor.parentElement.insertBefore(eoc, modifyStart ? anchor : anchor.nextSibling);
        }
      }
    }
    selPrevRange = range.cloneRange();
  } catch (e) { /* 极端选区形态，忽略，不影响菜单 */ }
  clearTimeout(selChangeTimer);
  // 防抖 300ms：拖拽选区把手时 selectionchange 持续触发，松手后选区稳定才弹菜单
  selChangeTimer = setTimeout(() => {
    if (!readerState) return; // 阅读器可能已关
    const sel2 = window.getSelection();
    if (!sel2 || sel2.isCollapsed || sel2.rangeCount === 0) return;
    const range2 = sel2.getRangeAt(0);
    let el = range2.startContainer;
    if (el.nodeType !== 1) el = el.parentNode;
    const tlEl = el && el.closest ? el.closest('.textLayer') : null;
    if (!tlEl) return; // 选区不在 textLayer（如输入框）不弹菜单
    const pageNum = Number(tlEl.dataset.pageNum);
    if (!pageNum) return;
    const rect = range2.getBoundingClientRect();
    showHlMenu(rect.left + rect.width / 2, rect.bottom, 'new', null, pageNum);
  }, 300);
}

function onReaderClick(e) {
  const sel = window.getSelection();
  if (sel && !sel.isCollapsed) return; // 选中场景由 mouseup 处理
  const mark = e.target && e.target.closest ? e.target.closest('mark.hl') : null;
  if (mark) {
    const annoId = mark.dataset.annoId;
    const anno = readerState && readerState.annos.find((a) => a.id === annoId);
    if (anno) {
      const r = mark.getBoundingClientRect();
      showHlMenu(r.left, r.bottom, 'edit', anno, anno.page);
    }
    return;
  }
  hideHlMenu();
}

function showHlMenu(x, y, mode, anno, pageNum) {
  const rs = readerState;
  if (!rs) return;
  const menu = document.getElementById('hl-menu');
  if (mode === 'new') {
    const tl = rs.textLayers[pageNum];
    const pageEl = tl && tl.container;
    const cap = pageEl ? captureSelection(pageEl) : null;
    if (!cap) { hideHlMenu(); return; }
    rs.hlDraft = { mode: 'new', pageNum, start: cap.start, end: cap.end, text: cap.text, annoId: null };
    document.getElementById('hl-delete').style.display = 'none';
    document.getElementById('hl-save').textContent = '高亮';
    document.getElementById('hl-note').value = '';
    currentHlColor = 'yellow';
  } else {
    rs.hlDraft = { mode: 'edit', pageNum, annoId: anno.id, start: anno.start_offset, end: anno.end_offset, text: anno.text };
    document.getElementById('hl-delete').style.display = '';
    document.getElementById('hl-save').textContent = '更新';
    document.getElementById('hl-note').value = anno.note || '';
    currentHlColor = anno.color || 'yellow';
  }
  updateSwatchSel();
  menu.style.display = 'flex';
  const mw = menu.offsetWidth || 240;
  let left = x - mw / 2;
  left = Math.max(8, Math.min(left, window.innerWidth - mw - 8));
  menu.style.left = left + 'px';
  const mh = menu.offsetHeight || 40;
  let top = y + 8;
  top = Math.max(8, Math.min(top, window.innerHeight - mh - 8)); // M7: y 夹取，选区在屏下半部时不弹到屏外
  menu.style.top = top + 'px';
}

function hideHlMenu() {
  const menu = document.getElementById('hl-menu');
  if (menu) menu.style.display = 'none';
  if (readerState) readerState.hlDraft = null;
}

function updateSwatchSel() {
  document.querySelectorAll('#hl-menu .hl-swatch').forEach((b) => {
    b.classList.toggle('sel', b.dataset.color === currentHlColor);
  });
}

async function saveHighlight(color, note) {
  const rs = readerState;
  const draft = rs && rs.hlDraft;
  if (!draft || draft.mode !== 'new') return;
  const anno = {
    id: uid(), paper_id: rs.paper.id, page: draft.pageNum, text: draft.text,
    start_offset: draft.start, end_offset: draft.end,
    color: color || 'yellow', note: note || '', created_at: nowISO()
  };
  try { await dbPutAnno(anno); rs.annos.push(anno); applyHighlights(draft.pageNum); }
  catch (e) { alert('保存高亮失败：' + (e && e.message ? e.message : e)); }
  const sel = window.getSelection();
  if (sel) sel.removeAllRanges();
  hideHlMenu();
}

async function updateHighlight(color, note) {
  const rs = readerState;
  const draft = rs && rs.hlDraft;
  if (!draft || draft.mode !== 'edit') return;
  const anno = rs.annos.find((a) => a.id === draft.annoId);
  if (!anno) return;
  anno.color = color || anno.color;
  anno.note = note || '';
  try { await dbPutAnno(anno); } catch (e) { alert('更新失败：' + (e && e.message ? e.message : e)); }
  applyHighlights(anno.page);
  hideHlMenu();
}

async function deleteHighlight() {
  const rs = readerState;
  const draft = rs && rs.hlDraft;
  if (!draft || draft.mode !== 'edit') return;
  if (!confirm('删除这条高亮？')) return;
  try { await dbDeleteAnno(draft.annoId); } catch (e) { /* ignore */ }
  rs.annos = rs.annos.filter((a) => a.id !== draft.annoId);
  applyHighlights(draft.pageNum);
  hideHlMenu();
}

// 阅读器笔记面板（M4）
function toggleReaderNotes() {
  const rs = readerState;
  if (!rs) return;
  const panel = document.getElementById('reader-notes');
  const area = document.getElementById('reader-notes-area');
  if (!panel.style.display || panel.style.display === 'none') {
    area.value = (rs.paper.notes_md || '');
    panel.style.display = 'flex';
  } else {
    panel.style.display = 'none';
  }
}

async function saveReaderNotes() {
  const rs = readerState;
  if (!rs || !rs.paper) return;
  rs.paper.notes_md = document.getElementById('reader-notes-area').value;
  rs.paper.updated_at = nowISO();
  try { await dbPut(rs.paper); } catch (e) { alert('笔记保存失败：' + (e && e.message ? e.message : e)); }
  document.getElementById('reader-notes').style.display = 'none';
}

document.getElementById('reader-close').addEventListener('click', closeReader);
document.getElementById('reader-zoom-in').addEventListener('click', () => readerZoom(1.2));
document.getElementById('reader-zoom-out').addEventListener('click', () => readerZoom(1 / 1.2));
document.getElementById('reader-notes-btn').addEventListener('click', toggleReaderNotes);
document.getElementById('reader-translate-btn').addEventListener('click', () => toggleTranslate());
document.getElementById('reader-tr-status').addEventListener('click', () => {
  const rs = readerState;
  if (!rs || !rs.tr || !rs.tr.enabled) return;
  if (!(rs.tr.done >= rs.tr.total && rs.tr.total > 0)) return; // 仅整篇就绪时可点（重译当前页）
  const cur = currentReaderPage();
  if (cur) trRetranslatePage(cur);
});
document.getElementById('reader-scroll').addEventListener('click', onReaderTrClick); // v2：点句弹 ZH
document.getElementById('reader-notes-close').addEventListener('click', () => {
  document.getElementById('reader-notes').style.display = 'none';
});
document.getElementById('reader-notes-save').addEventListener('click', saveReaderNotes);
document.querySelectorAll('#hl-menu .hl-swatch').forEach((b) => {
  b.addEventListener('click', () => { currentHlColor = b.dataset.color; updateSwatchSel(); });
});
document.getElementById('hl-save').addEventListener('click', () => {
  const rs = readerState; const draft = rs && rs.hlDraft; if (!draft) return;
  const note = document.getElementById('hl-note').value.trim();
  if (draft.mode === 'new') saveHighlight(currentHlColor, note);
  else updateHighlight(currentHlColor, note);
});
document.getElementById('hl-delete').addEventListener('click', deleteHighlight);

// ===== Service Worker 注册 + 更新提示（M7）=====

if ('serviceWorker' in navigator) {
  let refreshing = false;
  // P0：横幅改底部 pill（不挡阅读器顶栏 z-40），加"稍后"关闭 + 同会话不重复弹。
  // P0：waiting 模式--发现新 SW installed 才提示，用户点"刷新"才 postMessage SKIP_WAITING
  // 让其接管，不在阅读中途强制 reload 丢现场。
  const showUpdateBanner = () => {
    if (sessionStorage.getItem('sw-update-dismissed')) return;
    let b = document.getElementById('update-banner');
    if (!b) {
      b = document.createElement('div');
      b.id = 'update-banner';
      b.style.cssText = 'position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:90;display:flex;align-items:center;gap:12px;background:var(--accent);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,0.4);max-width:92vw';
      const label = document.createElement('span');
      label.textContent = '有新版本';
      const refresh = document.createElement('span');
      refresh.textContent = '刷新';
      refresh.style.cssText = 'text-decoration:underline;cursor:pointer';
      refresh.addEventListener('click', () => {
        // 通知 waiting 的 SW 接管；controllerchange 时再 reload（见下）
        navigator.serviceWorker.getRegistration().then((reg) => {
          if (reg && reg.waiting) reg.waiting.postMessage({ type: 'SKIP_WAITING' });
        });
      });
      const close = document.createElement('span');
      close.textContent = '稍后';
      close.style.cssText = 'cursor:pointer;opacity:0.75;text-decoration:underline';
      close.addEventListener('click', () => { sessionStorage.setItem('sw-update-dismissed', '1'); b.style.display = 'none'; });
      b.appendChild(label);
      b.appendChild(refresh);
      b.appendChild(close);
      document.body.appendChild(b);
    }
    b.style.display = 'flex';
  };
  // 防循环：本次页面若是 controllerchange reload 的结果，不再自动 reload（避免 SW 异常状态导致 reload 死循环"一直刷新"）
  const swReloaded = sessionStorage.getItem('sw-reloaded');
  if (swReloaded) sessionStorage.removeItem('sw-reloaded');
  // controllerchange：用户点"刷新" -> SKIP_WAITING -> 新 SW 接管 -> reload
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    if (swReloaded) return; // 刚 reload 过的页面不再自动 reload（防循环）
    refreshing = true;
    sessionStorage.setItem('sw-reloaded', '1');
    // 存阅读现场：reload 后自动回到原论文（restoreReaderProgress 恢复页位），避免 SW 更新 reload 退出阅读器丢现场
    try {
      if (typeof readerState !== 'undefined' && readerState && readerState.paper && readerState.paper.id) {
        sessionStorage.setItem('reader-restore', readerState.paper.id);
      }
    } catch (e) { /* sessionStorage 不可用时忽略 */ }
    location.reload();
  });
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then((reg) => {
      // 已有 waiting 的 SW（上次提示过但用户没刷新）直接再提示
      if (reg.waiting) showUpdateBanner();
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          // 新 SW 进入 installed 且已有旧 controller（非首次注册）才提示
          if (nw.state === 'installed' && navigator.serviceWorker.controller) showUpdateBanner();
        });
      });
    }).catch((err) => console.warn('SW 注册失败:', err));
  });
}

// ===== 启动 =====
openDB()
  .then(async () => {
    renderAcct(); render();
    if (sbSession()) syncPull().catch((e) => console.warn('pull:', e.message));
    // SW 更新 reload 后恢复阅读现场（controllerchange 前存了 paper id）
    try {
      const rid = sessionStorage.getItem('reader-restore');
      if (rid) {
        sessionStorage.removeItem('reader-restore');
        const all = await dbAll();
        const p = all.find((x) => x.id === rid);
        if (p) openReader(p);
      }
    } catch (e) { /* ignore */ }
  })
  .catch((err) => {
    document.getElementById('list-queue').innerHTML =
      `<div class="empty">数据库打开失败：${escapeHtml(err && err.message ? err.message : err)}</div>`;
  });
</script>
