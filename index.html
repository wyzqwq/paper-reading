<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="论文阅读">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>论文阅读</title>
<style>
  /* 占位深色主题（M7 定稿）。配色 token 暂定：bg #1a1a2e / text #d4d4e0 / accent #6c8cff */
  :root {
    --bg: #1a1a2e;
    --surface: #242440;
    --surface-2: #2c2c4f;
    --text: #d4d4e0;
    --muted: #8a8aa3;
    --accent: #6c8cff;
    --accent-h: #5a7ae8;
    --border: #2e2e4f;
    --danger: #e06c6c;
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 16px; line-height: 1.5;
    max-width: 720px; margin: 0 auto;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; background: var(--bg); z-index: 10;
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top);
  }
  header h1 { margin: 0; padding: 14px 16px 6px; font-size: 18px; font-weight: 600; }
  nav.tabs { display: flex; padding: 0 8px; }
  nav.tabs button {
    flex: 1; background: none; border: none; color: var(--muted);
    padding: 10px 8px; font-size: 14px; cursor: pointer;
    border-bottom: 2px solid transparent; border-radius: 0;
  }
  nav.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  main { padding: 12px 16px 80px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 16px; font-size: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 10px;
  }
  .card .title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .card .authors { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .card .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .badge.status-want { background: #3a3a5f; color: var(--text); }
  .badge.status-reading { background: #2d4a6e; color: #a8c4ff; }
  .badge.status-done { background: #2d4e3a; color: #a8e8c4; }
  .badge.status-abandoned { background: #4e2d2d; color: #e8a8a8; }
  .tag { background: var(--surface-2); color: var(--muted); padding: 1px 6px; border-radius: 8px; font-size: 11px; }
  .stars { color: var(--accent); letter-spacing: 1px; }
  .card .url-line { margin-top: 6px; word-break: break-all; }
  .card .actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .card .actions button {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  .card .actions button:hover { background: var(--accent); color: #fff; }
  .card .actions button.danger:hover { background: var(--danger); color: #fff; }
  .fab {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff;
    border: none; font-size: 28px; line-height: 1; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4); z-index: 20;
  }
  .fab:hover { background: var(--accent-h); }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 30;
    display: none; align-items: flex-end; justify-content: center;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--surface); width: 100%; max-width: 720px;
    border-radius: var(--radius) var(--radius) 0 0; padding: 16px;
    max-height: 92vh; overflow-y: auto;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  .modal h2 { margin: 0 0 4px; font-size: 16px; }
  .modal .hint { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .modal input, .modal textarea, .modal select {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 14px; font-family: inherit;
  }
  .modal textarea { min-height: 80px; resize: vertical; }
  .modal .row { display: flex; gap: 8px; align-items: stretch; }
  .modal .row > input { flex: 1; }
  .modal .btns { display: flex; gap: 8px; margin-top: 16px; }
  .modal .btns button { flex: 1; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .btn-primary { background: var(--accent); color: #fff; border: none; }
  .btn-primary:hover { background: var(--accent-h); }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .star-input { display: flex; align-items: center; gap: 2px; }
  .star-input span.star { cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; }
  .star-input span.star.on { color: var(--accent); }
  .star-input .clr { font-size: 12px; color: var(--muted); margin-left: 8px; cursor: pointer; }
  .url-link { color: var(--accent); text-decoration: none; font-size: 12px; }
  .url-text { color: var(--muted); font-size: 12px; }
  /* 阅读器（M2） */
  .reader {
    position: fixed; inset: 0; background: #2a2a3a; z-index: 40;
    display: none; flex-direction: column;
  }
  .reader.show { display: flex; }
  .reader-topbar {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding-top: calc(8px + env(safe-area-inset-top)); flex-shrink: 0;
  }
  .reader-topbar button {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 14px; line-height: 1;
  }
  .reader-topbar button:hover { background: var(--accent); color: #fff; }
  .reader-close { font-size: 16px; }
  .reader-pageinfo { font-size: 13px; color: var(--muted); min-width: 64px; text-align: center; }
  .reader-progress { flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .reader-progress > div { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s; }
  .reader-zoom { display: flex; gap: 4px; }
  .reader-scroll {
    flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 0;
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    -webkit-overflow-scrolling: touch;
  }
  .reader-page { display: flex; justify-content: center; }
  .reader-page canvas {
    display: block; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .reader-loading, .reader-error { color: var(--muted); text-align: center; padding: 40px 20px; font-size: 14px; }
  .reader-error { color: var(--danger); }
</style>
</head>
<body>
<header>
  <h1>论文阅读</h1>
  <nav class="tabs">
    <button data-tab="feed">今日推荐</button>
    <button data-tab="queue" class="active">阅读队列</button>
    <button data-tab="archive">已读归档</button>
  </nav>
</header>

<main>
  <section id="tab-feed" class="tab-panel" style="display:none">
    <div class="empty">日推功能将在 M5 开发（订阅 arXiv 分类、每日拉取、排序、加入想读/跳过）。当前请先用「阅读队列」手动管理论文。</div>
  </section>
  <section id="tab-queue" class="tab-panel">
    <div id="list-queue"></div>
  </section>
  <section id="tab-archive" class="tab-panel" style="display:none">
    <div id="list-archive"></div>
  </section>
</main>

<button class="fab" id="add-btn" aria-label="新增论文">+</button>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <h2 id="modal-title">新增论文</h2>
    <p class="hint" id="modal-hint"></p>
    <input type="hidden" id="f-id">
    <label>标题 *</label>
    <input id="f-title" placeholder="论文标题">
    <label>作者（逗号分隔）</label>
    <input id="f-authors" placeholder="Author A, Author B">
    <label>来源</label>
    <select id="f-source">
      <option value="manual">手动录入</option>
      <option value="url">URL（其它网站 PDF / 页面）</option>
      <option value="arxiv">arXiv（链接 / ID）</option>
      <option value="local">本地 PDF 文件</option>
    </select>
    <div id="src-arxiv" class="src-fields" style="display:none">
      <label>arXiv 链接或 ID</label>
      <div class="row">
        <input id="f-arxiv-input" placeholder="https://arxiv.org/abs/1706.03762 或 1706.03762">
        <button type="button" id="f-arxiv-fetch" class="btn-secondary" style="flex:0 0 auto">拉取</button>
      </div>
    </div>
    <div id="src-local" class="src-fields" style="display:none">
      <label>PDF 文件</label>
      <input type="file" id="f-file" accept="application/pdf">
    </div>
    <label>URL</label>
    <input id="f-url" placeholder="https://...">
    <label>摘要</label>
    <textarea id="f-abstract" placeholder="摘要（可选）"></textarea>
    <label>状态</label>
    <select id="f-status">
      <option value="want">想读</option>
      <option value="reading">在读</option>
      <option value="done">已读</option>
      <option value="abandoned">弃读</option>
    </select>
    <label>评分</label>
    <div class="star-input" id="f-rating">
      <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span>
      <span class="clr">清除</span>
    </div>
    <label>标签（逗号分隔）</label>
    <input id="f-tags" placeholder="transformer, nlp">
    <label>笔记（Markdown）</label>
    <textarea id="f-notes" placeholder="阅读笔记..."></textarea>
    <div class="btns">
      <button class="btn-secondary" id="cancel-btn">取消</button>
      <button class="btn-primary" id="save-btn">保存</button>
    </div>
  </div>
</div>

<div class="reader" id="reader">
  <div class="reader-topbar">
    <button class="reader-close" id="reader-close" aria-label="关闭阅读器">✕</button>
    <span class="reader-pageinfo" id="reader-pageinfo"></span>
    <div class="reader-progress"><div id="reader-progress-fill"></div></div>
    <div class="reader-zoom">
      <button id="reader-zoom-out" aria-label="缩小">−</button>
      <button id="reader-zoom-in" aria-label="放大">＋</button>
    </div>
  </div>
  <div class="reader-scroll" id="reader-scroll"></div>
</div>

<script>
// ===== IndexedDB：papers + pdfFiles（M3 加 pdfFiles 存本地 PDF 二进制；§4.1 子集；M6 接 Supabase 同步）=====
const DB_NAME = 'paper-reading';
const DB_VERSION = 2;
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('papers')) {
        const s = d.createObjectStore('papers', { keyPath: 'id' });
        s.createIndex('status', 'status', { unique: false });
        s.createIndex('updated_at', 'updated_at', { unique: false });
      }
      // v2：本地 PDF 二进制 store（key = paper.id）
      if (!d.objectStoreNames.contains('pdfFiles')) {
        d.createObjectStore('pdfFiles', { keyPath: 'id' });
      }
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}

function uid() {
  // RFC4122 v4 近似（Math.random，非加密强度；M6 同步时如需可换 crypto.randomUUID）
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function store(mode) { return db.transaction('papers', mode).objectStore('papers'); }

function dbAll() {
  return new Promise((resolve, reject) => {
    const req = store('readonly').getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

function dbPut(paper) {
  return new Promise((resolve, reject) => {
    const req = store('readwrite').put(paper);
    req.onsuccess = () => resolve(paper);
    req.onerror = () => reject(req.error);
  });
}

function dbDelete(id) {
  return new Promise((resolve, reject) => {
    const req = store('readwrite').delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// pdfFiles store（M3）：存本地 PDF 二进制，key = paper.id；M6 同步时改走 Supabase Storage
function fileStore(mode) { return db.transaction('pdfFiles', mode).objectStore('pdfFiles'); }

function dbPutFile(file) {
  return new Promise((resolve, reject) => {
    const req = fileStore('readwrite').put(file);
    req.onsuccess = () => resolve(file);
    req.onerror = () => reject(req.error);
  });
}

function dbGetFile(id) {
  return new Promise((resolve, reject) => {
    const req = fileStore('readonly').get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

function dbDeleteFile(id) {
  return new Promise((resolve, reject) => {
    const req = fileStore('readwrite').delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// ===== 模型 =====
const STATUS_LABEL = { want: '想读', reading: '在读', done: '已读', abandoned: '弃读' };

function nowISO() { return new Date().toISOString(); }

function parseList(str) {
  return (str || '').split(',').map((s) => s.trim()).filter(Boolean);
}

// 评分输入的模块级状态（编辑器复用）
let currentRating = 0;
let editingId = null;     // 当前编辑条目 id；null=新增
let editingPaper = null;  // 编辑时保留旧条目（保住 arxiv_id/local_file_path/read_progress/added_at）
let currentArxivId = null;  // M3：arXiv 拉取到的 id（保存时写入 paper.arxiv_id）
let currentFileData = null; // M3：本地 PDF 选中后的 ArrayBuffer（保存时写入 pdfFiles store）

function makePaperFromForm() {
  const existing = editingId ? (editingPaper || {}) : {};
  const src = document.getElementById('f-source').value;
  return {
    id: document.getElementById('f-id').value || uid(),
    title: document.getElementById('f-title').value.trim(),
    authors: parseList(document.getElementById('f-authors').value),
    abstract: document.getElementById('f-abstract').value.trim() || null,
    source_type: src,
    arxiv_id: (src === 'arxiv' && currentArxivId) ? currentArxivId : (existing.arxiv_id || null),
    url: document.getElementById('f-url').value.trim() || null,
    local_file_path: src === 'local' ? (existing.local_file_path || 'local') : null,
    status: document.getElementById('f-status').value,
    rating: currentRating || null,
    tags: parseList(document.getElementById('f-tags').value),
    notes_md: document.getElementById('f-notes').value,
    read_progress: existing.read_progress || 0,
    added_at: existing.added_at || nowISO(),
    updated_at: nowISO()
  };
}

// ===== 渲染 =====
function stars(n) {
  n = n || 0;
  return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n);
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function safeUrl(u) { return /^https?:\/\//i.test(u || ''); }

function statusActions(status) {
  // 全部状态可互转（计划书 §4.1：想读/在读/已读/弃读 全可逆）
  const btns = [];
  if (status !== 'reading') btns.push('<button data-status="reading">设为在读</button>');
  if (status !== 'want') btns.push('<button data-status="want">设为想读</button>');
  if (status !== 'done') btns.push('<button data-status="done">设为已读</button>');
  if (status !== 'abandoned') btns.push('<button data-status="abandoned">弃读</button>');
  return btns.join('');
}

function canRead(p) {
  // local：本地 PDF 存在即读（openReader 内再校验）；arXiv/url：需可解析的 http(s) PDF 链接
  if (p.source_type === 'local') return true;
  const u = resolvePdfUrl(p);
  return !!u && /^https?:\/\//i.test(u);
}

function renderCard(p) {
  const el = document.createElement('div');
  el.className = 'card';
  const tagsHtml = (p.tags || []).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join('');
  let urlHtml = '';
  if (p.url) {
    urlHtml = safeUrl(p.url)
      ? `<div class="url-line"><a class="url-link" href="${escapeHtml(p.url)}" target="_blank" rel="noopener">${escapeHtml(p.url)}</a></div>`
      : `<div class="url-line"><span class="url-text">${escapeHtml(p.url)}</span></div>`;
  }
  el.innerHTML =
    `<div class="title">${escapeHtml(p.title)}</div>` +
    `<div class="authors">${escapeHtml((p.authors || []).join(', '))}</div>` +
    `<div class="meta">` +
      `<span class="badge status-${p.status}">${STATUS_LABEL[p.status] || p.status}</span>` +
      (p.rating ? `<span class="stars">${stars(p.rating)}</span>` : '') +
      tagsHtml +
    `</div>` +
    urlHtml +
    `<div class="actions">` +
      (canRead(p) ? `<button data-act="read">阅读</button>` : '') +
      `<button data-act="edit">编辑</button>` +
      statusActions(p.status) +
      `<button data-act="delete" class="danger">删除</button>` +
    `</div>`;
  el.querySelector('[data-act="edit"]').addEventListener('click', () => openEditor(p));
  el.querySelector('[data-act="delete"]').addEventListener('click', () => del(p));
  const readBtn = el.querySelector('[data-act="read"]');
  if (readBtn) readBtn.addEventListener('click', () => openReader(p));
  el.querySelectorAll('[data-status]').forEach((b) => {
    b.addEventListener('click', () => changeStatus(p, b.dataset.status));
  });
  return el;
}

function sortPapers(list) {
  // 在读优先，想读其次，已读/弃读最后；同状态按 updated_at 倒序
  const rank = { reading: 0, want: 1, done: 2, abandoned: 3 };
  return list.slice().sort((a, b) => {
    if (rank[a.status] !== rank[b.status]) return rank[a.status] - rank[b.status];
    return (b.updated_at || '').localeCompare(a.updated_at || '');
  });
}

function renderList(elId, list) {
  const el = document.getElementById(elId);
  el.innerHTML = '';
  if (list.length === 0) {
    el.innerHTML = '<div class="empty">暂无条目</div>';
    return;
  }
  list.forEach((p) => el.appendChild(renderCard(p)));
}

async function render() {
  const all = await dbAll();
  const queue = sortPapers(all.filter((p) => p.status === 'want' || p.status === 'reading'));
  const archive = sortPapers(all.filter((p) => p.status === 'done' || p.status === 'abandoned'));
  renderList('list-queue', queue);
  renderList('list-archive', archive);
}

// ===== 编辑器 =====
function renderStars() {
  document.querySelectorAll('#f-rating span.star').forEach((s) => {
    s.classList.toggle('on', Number(s.dataset.v) <= currentRating);
  });
}

function openEditor(p) {
  p = p || null;
  editingId = p ? p.id : null;
  editingPaper = p || null;
  currentArxivId = p ? (p.arxiv_id || null) : null;
  currentFileData = null;
  document.getElementById('modal-title').textContent = p ? '编辑论文' : '新增论文';
  document.getElementById('modal-hint').textContent = p
    ? '修改后保存即更新该条目。'
    : '可手动录入；或选「arXiv」一键拉取元数据，选「本地 PDF 文件」导入。';
  document.getElementById('f-id').value = p ? p.id : '';
  document.getElementById('f-title').value = p ? (p.title || '') : '';
  document.getElementById('f-authors').value = p ? (p.authors || []).join(', ') : '';
  document.getElementById('f-source').value = p ? (p.source_type || 'manual') : 'manual';
  document.getElementById('f-arxiv-input').value = p && p.arxiv_id ? p.arxiv_id : '';
  document.getElementById('f-file').value = '';
  document.getElementById('f-url').value = p ? (p.url || '') : '';
  document.getElementById('f-abstract').value = p ? (p.abstract || '') : '';
  document.getElementById('f-status').value = p ? (p.status || 'want') : 'want';
  document.getElementById('f-tags').value = p ? (p.tags || []).join(', ') : '';
  document.getElementById('f-notes').value = p ? (p.notes_md || '') : '';
  currentRating = p ? (p.rating || 0) : 0;
  renderStars();
  updateSourceFields();
  document.getElementById('overlay').classList.add('show');
}

function closeEditor() {
  document.getElementById('overlay').classList.remove('show');
}

async function save() {
  const paper = makePaperFromForm();
  if (!paper.title) { alert('请填写标题'); return; }
  // 本地 PDF：新增条目必须选了文件
  if (paper.source_type === 'local' && !currentFileData && !editingId) {
    alert('请选择本地 PDF 文件。'); return;
  }
  try {
    await dbPut(paper);
    // 本地 PDF：有新选文件就写入 pdfFiles（key=paper.id）
    if (paper.source_type === 'local' && currentFileData) {
      await dbPutFile({
        id: paper.id,
        data: currentFileData,
        size: currentFileData.byteLength,
        added_at: nowISO()
      });
    }
    // 来源从 local 改成其它：清理旧 pdfFile，避免孤儿二进制
    if (paper.source_type !== 'local' && editingId) {
      await dbDeleteFile(paper.id).catch(() => {});
    }
    currentFileData = null;
    currentArxivId = null;
    closeEditor();
    render();
  } catch (err) {
    alert('保存失败：' + (err && err.message ? err.message : err));
  }
}

async function del(p) {
  if (!confirm(`删除「${p.title}」？此操作不可撤销。`)) return;
  await dbDelete(p.id);
  await dbDeleteFile(p.id).catch(() => {}); // 本地 PDF 二进制一并删
  render();
}

async function changeStatus(p, status) {
  p.status = status;
  p.updated_at = nowISO();
  await dbPut(p);
  render();
}

// ===== 导入：arXiv 元数据 / 本地 PDF（M3）=====
document.getElementById('f-source').addEventListener('change', updateSourceFields);
document.getElementById('f-arxiv-fetch').addEventListener('click', fetchArxiv);
document.getElementById('f-file').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0];
  if (!f) { currentFileData = null; return; }

    alert('PDF 超过 60MB，建议改用 URL 导入（M6 起可存 Supabase Storage）。');
    e.target.value = '';

    return;
  }

    currentFileData = await f.arrayBuffer();
    // 标题为空时用文件名预填

    }

    currentFileData = null;
  }
});

// ===== 导入辅助：arXiv 元数据解析 + 来源字段切换（M3）=====
// arXiv API 经 Supabase Edge Function 代理（M0 实测 export.arxiv.org 不发 ACAO，浏览器直连被 CORS 阻）
const ARXIV_PROXY = 'https://hjrrocbisrgtxgqnflpi.supabase.co/functions/v1/arxiv-proxy';
const ATOM_NS = 'http://www.w3.org/2005/Atom';

function extractArxivId(input) {
  // 接受 arXiv 链接（abs/pdf）或纯 ID；新式 2310.12345[v2]、老式 cs.LG/0701001[v2]
  if (!input) return null;
  const m = String(input).trim().match(/([0-9]{4}\.[0-9]+(?:v[0-9]+)?|[a-z.\-]+\/[0-9]{7}(?:v[0-9]+)?)/i);
  return m ? m[1] : null;
}

function textByTagNS(el, ns, tag) {
  const n = el.getElementsByTagNameNS(ns, tag)[0];
  return n ? (n.textContent || '').trim() : '';
}

function parseArxivXml(xml) {
  const doc = new DOMParser().parseFromString(xml, 'application/xml');
  if (doc.getElementsByTagName('parsererror').length) {
    throw new Error('arXiv 返回非合法 XML');
  }
  const entry = doc.getElementsByTagNameNS(ATOM_NS, 'entry')[0];
  if (!entry) throw new Error('arXiv 未返回条目（ID 可能无效或被限流）');
  // id 形如 http://arxiv.org/abs/1706.03762v2 -> 取 abs/ 后、去版本号
  const idText = textByTagNS(entry, ATOM_NS, 'id');
  const aidMatch = idText.match(/abs\/(.+?)(?:v\d+)?$/i);
  const arxiv_id = aidMatch ? aidMatch[1] : '';
  const title = textByTagNS(entry, ATOM_NS, 'title').replace(/\s+/g, ' ');
  const summary = textByTagNS(entry, ATOM_NS, 'summary').replace(/\s+/g, ' ');
  const authors = [];
  const authorEls = entry.getElementsByTagNameNS(ATOM_NS, 'author');
  for (let i = 0; i < authorEls.length; i++) {
    const n = textByTagNS(authorEls[i], ATOM_NS, 'name');
    if (n) authors.push(n);
  }
  const tags = [];
  const catEls = entry.getElementsByTagNameNS(ATOM_NS, 'category');
  for (let i = 0; i < catEls.length; i++) {
    const t = catEls[i].getAttribute('term');
    if (t) tags.push(t);
  }
  return {
    arxiv_id,
    title,
    authors,
    abstract: summary,
    url: arxiv_id ? ('https://arxiv.org/abs/' + arxiv_id) : '',
    tags
  };
}

async function fetchArxiv() {
  const input = document.getElementById('f-arxiv-input').value;
  const aid = extractArxivId(input);
  const btn = document.getElementById('f-arxiv-fetch');
  if (!aid) { alert('无法识别 arXiv ID。请粘贴 arXiv 链接或 ID（如 1706.03762）。'); return; }
  btn.disabled = true; btn.textContent = '拉取中…';
  try {
    const res = await fetch(ARXIV_PROXY + '?id_list=' + encodeURIComponent(aid));
    if (!res.ok) throw new Error('代理返回 HTTP ' + res.status);
    const xml = await res.text();
    const meta = parseArxivXml(xml);
    if (!meta.title) throw new Error('未解析到标题');
    document.getElementById('f-title').value = meta.title;
    document.getElementById('f-authors').value = meta.authors.join(', ');
    document.getElementById('f-abstract').value = meta.abstract;
    document.getElementById('f-url').value = meta.url;
    document.getElementById('f-tags').value = meta.tags.join(', ');
    currentArxivId = meta.arxiv_id;
  } catch (e) {
    alert('arXiv 拉取失败：' + (e && e.message ? e.message : e));
  } finally {
    btn.disabled = false; btn.textContent = '拉取';
  }
}

function updateSourceFields() {
  const src = document.getElementById('f-source').value;
  document.getElementById('src-arxiv').style.display = (src === 'arxiv') ? '' : 'none';
  document.getElementById('src-local').style.display = (src === 'local') ? '' : 'none';
}

// ===== 阅读器（M2：pdf.js 连续滚动 + 进度记忆）=====
let pdfjsLib = null;
let readerState = null;

function resolvePdfUrl(p) {
  let u = p && p.url;
  if (!u) return null;
  // arXiv abs/pdf 链接统一转 https://arxiv.org/pdf/<id>（M0 实测 arxiv PDF CORS 通，可直连）
  const m = u.match(/arxiv\.org\/(?:abs|pdf)\/([0-9]{4}\.[0-9]+(?:v[0-9]+)?|[a-z.\-]+\/[0-9]{7}(?:v[0-9]+)?)/i);
  if (m) return 'https://arxiv.org/pdf/' + m[1];
  return u;
}

async function openReader(paper) {
  // 决定加载源：local 走 IndexedDB 二进制（dbGetFile）；arXiv/url 走 resolvePdfUrl（abs 归一化为 pdf）
  let url = null;
  let docInit = {};
  if (paper.source_type === 'local') {
    try {
      const file = await dbGetFile(paper.id);
      if (!file || !file.data) { alert('本地 PDF 文件缺失（可能在清理或换设备后丢失）。'); return; }
      docInit = { data: file.data };
    } catch (e) {
      alert('读取本地 PDF 失败：' + (e && e.message ? e.message : e));
      return;
    }
  } else {
    url = resolvePdfUrl(paper);
    if (!url) { alert('该条目没有可加载的 PDF 链接。'); return; }
    docInit = { url };
  }
  const overlay = document.getElementById('reader');
  overlay.classList.add('show');
  const scrollEl = document.getElementById('reader-scroll');
  scrollEl.innerHTML = '<div class="reader-loading">加载中…</div>';
  document.getElementById('reader-pageinfo').textContent = '';
  document.getElementById('reader-progress-fill').style.width = '0%';

  if (!pdfjsLib) {
    try {
      pdfjsLib = await import('./vendor/pdfjs/pdf.min.mjs');
      pdfjsLib.GlobalWorkerOptions.workerSrc = './vendor/pdfjs/pdf.worker.min.mjs';
    } catch (e) {
      scrollEl.innerHTML = '<div class="reader-error">pdf.js 加载失败：' + escapeHtml(e && e.message || String(e)) + '</div>';
      return;
    }
  }
  // 取最新条目（用 DB 里的 read_progress 恢复，避免对象过期）
  let p = paper;
  try {
    const all = await dbAll();
    const fresh = all.find((x) => x.id === paper.id);
    if (fresh) p = fresh;
  } catch (e) { /* ignore */ }

  readerState = {
    paper: p, url, pdf: null, loadingTask: null, numPages: 0,
    canvases: [], baseScale: 1, zoom: 1, dpr: window.devicePixelRatio || 1,
    io: null, saveTimer: null, scrollEl, ready: false
  };

  try {
    const task = pdfjsLib.getDocument({
      ...docInit,
      wasmUrl: './vendor/pdfjs/wasm/',
      standardFontDataUrl: './vendor/pdfjs/standard_fonts/'
    });
    readerState.loadingTask = task;
    const pdf = await task.promise;
    readerState.pdf = pdf;
    readerState.numPages = pdf.numPages;
    await layoutPages();
    readerState.ready = true;
    setupReaderObserver();
    restoreReaderProgress();
    scrollEl.addEventListener('scroll', onReaderScroll, { passive: true });
  } catch (e) {
    scrollEl.innerHTML = '<div class="reader-error">PDF 加载失败：' +
      escapeHtml(e && e.message || String(e)) +
      '<br>可能文件损坏、网络问题或跨域限制。</div>';
  }
}

async function layoutPages() {
  const rs = readerState;
  const scrollEl = rs.scrollEl;
  scrollEl.innerHTML = '';
  rs.canvases = [];
  // 适配宽度算 baseScale（按第 1 页宽度），zoom 为倍数
  const containerW = scrollEl.clientWidth - 24;
  const page1 = await rs.pdf.getPage(1);
  const vp1 = page1.getViewport({ scale: 1 });
  rs.baseScale = containerW > 0 ? containerW / vp1.width : 1;
  const scale = rs.baseScale * rs.zoom;
  for (let i = 1; i <= rs.numPages; i++) {
    const page = i === 1 ? page1 : await rs.pdf.getPage(i);
    const vpRender = page.getViewport({ scale: scale * rs.dpr });
    const vpCss = page.getViewport({ scale });
    const div = document.createElement('div');
    div.className = 'reader-page';
    const canvas = document.createElement('canvas');
    canvas.width = Math.ceil(vpRender.width);
    canvas.height = Math.ceil(vpRender.height);
    canvas.style.width = Math.round(vpCss.width) + 'px';
    canvas.style.height = Math.round(vpCss.height) + 'px';
    canvas._page = page;
    canvas._pageNum = i;
    canvas._renderedScale = 0;
    div.appendChild(canvas);
    scrollEl.appendChild(div);
    rs.canvases.push(canvas);
  }
}

function setupReaderObserver() {
  const rs = readerState;
  rs.io = new IntersectionObserver((entries) => {
    for (const e of entries) if (e.isIntersecting) renderPage(e.target);
  }, { root: rs.scrollEl, rootMargin: '600px 0px' });
  rs.canvases.forEach((c) => rs.io.observe(c));
}

async function renderPage(canvas) {
  const rs = readerState;
  if (!rs) return;
  const renderScale = rs.baseScale * rs.zoom * rs.dpr;
  if (canvas._renderedScale === renderScale) return;
  const page = canvas._page;
  const vp = page.getViewport({ scale: renderScale });
  if (canvas.width !== Math.ceil(vp.width)) canvas.width = Math.ceil(vp.width);
  if (canvas.height !== Math.ceil(vp.height)) canvas.height = Math.ceil(vp.height);
  const ctx = canvas.getContext('2d');
  if (canvas._renderTask) { try { canvas._renderTask.cancel(); } catch (e) { /* ignore */ } }
  try {
    canvas._renderTask = page.render({ canvasContext: ctx, viewport: vp });
    await canvas._renderTask.promise;
    canvas._renderedScale = renderScale;
  } catch (e) {
    // RenderingCancelledException（缩放/关闭时取消），忽略
  }
}

function currentReaderPage() {
  const rs = readerState;
  const top = rs.scrollEl.getBoundingClientRect().top;
  let cur = 1;
  for (const c of rs.canvases) {
    if (c.getBoundingClientRect().top - top <= 30) cur = c._pageNum;
  }
  return cur;
}

function onReaderScroll() {
  const rs = readerState;
  if (!rs || !rs.ready) return;
  const st = rs.scrollEl.scrollTop;
  const sh = rs.scrollEl.scrollHeight - rs.scrollEl.clientHeight;
  const frac = sh > 0 ? st / sh : 0;
  const cur = currentReaderPage();
  document.getElementById('reader-pageinfo').textContent = cur + ' / ' + rs.numPages;
  document.getElementById('reader-progress-fill').style.width = (Math.max(0, Math.min(1, frac)) * 100) + '%';
  if (rs.saveTimer) clearTimeout(rs.saveTimer);
  rs.saveTimer = setTimeout(() => saveReaderProgress(frac), 500);
}

async function saveReaderProgress(frac) {
  const rs = readerState;
  if (!rs || !rs.paper) return;
  try {
    const p = rs.paper;
    p.read_progress = Math.max(0, Math.min(1, frac));
    p.updated_at = nowISO();
    await dbPut(p);
  } catch (e) { console.warn('保存进度失败', e); }
}

function restoreReaderProgress() {
  const rs = readerState;
  const frac = (rs.paper && typeof rs.paper.read_progress === 'number') ? rs.paper.read_progress : 0;
  requestAnimationFrame(() => {
    const sh = rs.scrollEl.scrollHeight - rs.scrollEl.clientHeight;
    rs.scrollEl.scrollTop = frac * sh;
    onReaderScroll();
  });
}

function readerZoom(delta) {
  const rs = readerState;
  if (!rs || !rs.ready) return;
  rs.zoom = Math.max(0.5, Math.min(4, rs.zoom * delta));
  const scale = rs.baseScale * rs.zoom;
  const prevFrac = rs.scrollEl.scrollHeight > rs.scrollEl.clientHeight
    ? rs.scrollEl.scrollTop / (rs.scrollEl.scrollHeight - rs.scrollEl.clientHeight) : 0;
  for (const c of rs.canvases) {
    const vpCss = c._page.getViewport({ scale });
    c.style.width = Math.round(vpCss.width) + 'px';
    c.style.height = Math.round(vpCss.height) + 'px';
    c._renderedScale = 0; // 失效，触发重渲染
  }
  requestAnimationFrame(() => {
    const sh = rs.scrollEl.scrollHeight - rs.scrollEl.clientHeight;
    rs.scrollEl.scrollTop = prevFrac * sh;
    const vh = window.innerHeight;
    for (const c of rs.canvases) {
      const r = c.getBoundingClientRect();
      if (r.bottom > 0 && r.top < vh) renderPage(c);
    }
  });
}

function closeReader() {
  const rs = readerState;
  if (rs) {
    if (rs.saveTimer) { clearTimeout(rs.saveTimer); saveReaderProgressNow(); }
    if (rs.io) rs.io.disconnect();
    if (rs.loadingTask) { try { rs.loadingTask.destroy(); } catch (e) { /* ignore */ } }
    if (rs.scrollEl) rs.scrollEl.removeEventListener('scroll', onReaderScroll);
  }
  document.getElementById('reader').classList.remove('show');
  readerState = null;
  render(); // 刷新列表（read_progress 已写回）
}

function saveReaderProgressNow() {
  const rs = readerState;
  if (!rs || !rs.paper) return;
  const sh = rs.scrollEl.scrollHeight - rs.scrollEl.clientHeight;
  const frac = sh > 0 ? rs.scrollEl.scrollTop / sh : 0;
  const p = rs.paper;
  p.read_progress = Math.max(0, Math.min(1, frac));
  p.updated_at = nowISO();
  dbPut(p).catch(() => {});
}

document.getElementById('reader-close').addEventListener('click', closeReader);
document.getElementById('reader-zoom-in').addEventListener('click', () => readerZoom(1.2));
document.getElementById('reader-zoom-out').addEventListener('click', () => readerZoom(1 / 1.2));

// ===== Service Worker 注册（M1 仅缓存 app 壳；更新提示留 M7）=====
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch((err) => console.warn('SW 注册失败:', err));
  });
}

// ===== 启动 =====
openDB()
  .then(() => render())
  .catch((err) => {
    document.getElementById('list-queue').innerHTML =
      `<div class="empty">数据库打开失败：${escapeHtml(err && err.message ? err.message : err)}</div>`;
  });
</script>
