<title>论文阅读</title>
<style>
  /* M7 定稿深色主题「墨纸」：暖墨黑底 + 古铜金 accent，旧书页反相 + 烫金题字感，蓝光少护眼 */
  :root {
    --bg: #1a1814;
    --surface: #24211c;
    --surface-2: #2e2a23;
    --text: #e8e3d8;
    --muted: #8a8478;
    --accent: #c9a96e;
    --accent-h: #b8975a;
    --border: #322e26;
    --danger: #c66b5a;
    --radius: 8px;
    --jade: #8fb3a8;                          /* v2 翻译：旧玉柔青，ZH 译文文字色 */
    --jade-bg: rgba(143, 179, 168, 0.20);     /* v2 翻译：点句高亮底色 */
    --jade-line: rgba(143, 179, 168, 0.45);   /* v2 翻译：已译句极淡下划线 */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    font-size: 16px; line-height: 1.5;
    max-width: 720px; margin: 0 auto;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-text-size-adjust: 100%;
  }
  header {
    position: sticky; top: 0; background: var(--bg); z-index: 10;
    border-bottom: 1px solid var(--border);
    padding-top: env(safe-area-inset-top);
  }
  header h1 { margin: 0; padding: 14px 16px 6px; font-size: 18px; font-weight: 600; }
  nav.tabs { display: flex; padding: 0 8px; }
  nav.tabs button {
    flex: 1; background: none; border: none; color: var(--muted);
    padding: 10px 8px; font-size: 14px; cursor: pointer;
    border-bottom: 2px solid transparent; border-radius: 0;
  }
  nav.tabs button.active { color: var(--text); border-bottom-color: var(--accent); }
  main { padding: 12px 16px 80px; }
  .empty { color: var(--muted); text-align: center; padding: 40px 16px; font-size: 14px; }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; margin-bottom: 10px;
  }
  .card .title { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .card .authors { color: var(--muted); font-size: 13px; margin-bottom: 6px; }
  .card .meta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; }
  .badge.status-want { background: #3a342a; color: var(--text); }
  .badge.status-reading { background: #3a3220; color: #c9a96e; }
  .badge.status-done { background: #2d3a2a; color: #a8c89a; }
  .badge.status-abandoned { background: #4a2d2a; color: #d8a8a8; }
  .tag { background: var(--surface-2); color: var(--muted); padding: 1px 6px; border-radius: 8px; font-size: 11px; }
  .stars { color: var(--accent); letter-spacing: 1px; }
  .card .url-line { margin-top: 6px; word-break: break-all; }
  .card .actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  .card .actions button {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer;
  }
  .card .actions button:hover { background: var(--accent); color: #fff; }
  .card .actions button.danger:hover { background: var(--danger); color: #fff; }
  .fab {
    position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom));
    width: 52px; height: 52px; border-radius: 50%; background: var(--accent); color: #fff;
    border: none; font-size: 28px; line-height: 1; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4); z-index: 20;
  }
  .fab:hover { background: var(--accent-h); }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 30;
    display: none; align-items: flex-end; justify-content: center;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--surface); width: 100%; max-width: 720px;
    border-radius: var(--radius) var(--radius) 0 0; padding: 16px;
    max-height: 92vh; overflow-y: auto;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }
  .modal h2 { margin: 0 0 4px; font-size: 16px; }
  .modal .hint { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  .modal label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  .modal input, .modal textarea, .modal select {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px 10px; font-size: 14px; font-family: inherit;
  }
  .modal textarea { min-height: 80px; resize: vertical; }
  .modal .row { display: flex; gap: 8px; align-items: stretch; }
  .modal .row > input { flex: 1; }
  .modal .btns { display: flex; gap: 8px; margin-top: 16px; }
  .modal .btns button { flex: 1; padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  /* 设置页 + 订阅管理（M5）*/
  .settings-btn {
    position: absolute; right: 8px; top: calc(10px + env(safe-area-inset-top));
    background: none; border: none; color: var(--muted); font-size: 20px; line-height: 1;
    cursor: pointer; padding: 6px 8px; border-radius: 6px;
  }
  .settings-btn:hover { color: var(--text); }
  .sub-item {
    display: flex; align-items: center; gap: 8px; padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .sub-item .sub-name { flex: 1; font-size: 14px; min-width: 0; }
  .sub-item .sub-name .sub-meta { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; word-break: break-all; }
  .sub-item .sub-toggle { font-size: 12px; cursor: pointer; padding: 5px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  .sub-item .sub-toggle.off { color: var(--muted); }
  .cat-picker { display: flex; flex-direction: column; gap: 10px; }
  .cat-group { display: flex; flex-direction: column; gap: 4px; }
  .cat-group-title { font-size: 11px; color: var(--muted); font-weight: 600; }
  .cat-group-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .cat-picker label {
    font-size: 12px; display: flex; align-items: center; gap: 4px; margin: 0;
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 14px; cursor: pointer; color: var(--text);
  }
  .cat-picker input[type=checkbox] { width: auto; }
  .cat-picker input[type=text] { flex: 1; font-size: 12px; padding: 6px 10px; }
  .kw-group { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .kw-group input { flex: 1; }
  .kw-group .kw-del { flex: 0 0 auto; padding: 8px 12px; font-size: 14px; }
  #sub-keywords { margin-bottom: 4px; }
  #sub-editor { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  #sub-editor h3 { color: var(--text); }
  .btn-primary { background: var(--accent); color: #fff; border: none; }
  .btn-primary:hover { background: var(--accent-h); }
  .btn-secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
  .star-input { display: flex; align-items: center; gap: 2px; }
  .star-input span.star { cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; }
  .star-input span.star.on { color: var(--accent); }
  .star-input .clr { font-size: 12px; color: var(--muted); margin-left: 8px; cursor: pointer; }
  .url-link { color: var(--accent); text-decoration: none; font-size: 12px; }
  .url-text { color: var(--muted); font-size: 12px; }
  /* 今日推荐（M5） */
  .feed-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .feed-toolbar .btn-secondary { padding: 6px 12px; font-size: 13px; }
  .feed-status { color: var(--muted); font-size: 12px; }
  .feed-card .feed-abs { color: var(--muted); font-size: 13px; margin: 4px 0 6px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .feed-card .score-badge { background: #2d4a6e; color: #a8c4ff; }
  .feed-card .sub-badge { background: var(--surface-2); color: var(--muted); }
  .feed-card .kw-tag { background: #3a3a4f; color: #c8b8ff; }
  .feed-card .actions a.url-link { align-self: center; }
  /* 阅读器（M2） */
  .reader {
    position: fixed; inset: 0; background: #2a2a3a; z-index: 40;
    display: none; flex-direction: column;
  }
  .reader.show { display: flex; }
  .reader-topbar {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    background: var(--bg); border-bottom: 1px solid var(--border);
    padding-top: calc(8px + env(safe-area-inset-top)); flex-shrink: 0;
  }
  .reader-topbar button {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 14px; line-height: 1;
  }
  .reader-topbar button:hover { background: var(--accent); color: #fff; }
  .reader-close { font-size: 16px; }
  .reader-pageinfo { font-size: 13px; color: var(--muted); min-width: 64px; text-align: center; }
  .reader-progress { flex: 1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
  .reader-progress > div { height: 100%; background: var(--accent); width: 0%; transition: width 0.1s; }
  .reader-zoom { display: flex; gap: 4px; }
  .reader-scroll {
    flex: 1; overflow-y: auto; overflow-x: auto; padding: 12px 0;
    display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
    /* M7: -webkit-overflow-scrolling:touch 已删（官方 viewerContainer 无此属性，iOS 13+ 已废弃且
       历史上引发子元素 hit-test/选区怪癖，fable 对抗审查点名）。touch-action:pan-x pan-y 暂保留
       （pinch 缩放依赖它禁止浏览器原生 pinch-zoom），待实机验证 Safari endOfContent 重定位修复后再 A/B。 */
    touch-action: pan-x pan-y;
  }
  .reader-page { display: flex; justify-content: center; position: relative; margin: 0 auto; }
  .reader-page canvas {
    display: block; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  .reader-loading, .reader-error { color: var(--muted); text-align: center; padding: 40px 20px; font-size: 14px; }
  .reader-error { color: var(--danger); }
  /* textLayer（M4）：透明文字层，盖在 canvas 上让文字可选/可高亮。
     pdf.js v6 的 bare TextLayer API 不注入 CSS（adoptedStyleSheets 为空），需宿主页提供官方
     textLayer 规则（position/overflow/transform-origin 等）。pdf.js v6 在 span inline style 直接设
     left/top/fontSize/fontFamily/transform，宿主只需设 --scale-factor（按 zoom 动态写，见 renderTextLayer）
     供 inline calc 解析；旧版的 --font-height/--scale-x CSS 变量机制 v6 已弃用。
     规则取自 pdfjs-dist@6.2.108 web/pdf_viewer.css 的 .textLayer 块。 */
  .textLayer {
    position: absolute; inset: 0; overflow: clip; line-height: 1;
    z-index: 0; opacity: 1; text-align: initial;
    -webkit-text-size-adjust: none; text-size-adjust: none; forced-color-adjust: none;
    /* M7: caret-color/letter-spacing/word-spacing/color-scheme/transform-origin 对齐官方
       text_layer_builder.css，caret-color:CanvasText 告知 iOS 这是文本选区上下文 */
    caret-color: CanvasText; letter-spacing: normal; word-spacing: normal;
    color-scheme: only light; transform-origin: 0 0;
    /* --scale-factor 按 zoom 动态写（见 renderTextLayer），pdf.js v6 span inline left/top/fontSize 全依赖它。
       --scale-round-x/y 官方 setLayerDimensions 用（round() 降采样对齐像素），fallback 1px，此处显式设同值。 */
    --scale-round-x: 1px; --scale-round-y: 1px;
    /* pdf.js v6.2.108 官方 pdf_viewer.css 变量链：宿主设 --total-scale-factor（按 zoom 动态写，见 renderTextLayer），
       派生 --text-scale-factor = total × min-font-size；leaf span font-size = text-scale-factor × --font-height（span inline 设）。
       旧注释"--font-height/--scale-x 已弃用、需设 --scale-factor"是错的：实测 v6.2.108 span inline 仍设 --font-height/--scale-x，
       源码不含 --scale-factor。漏写 font-size/transform 规则会让 fontSize 回退 16px、无 scaleX，致选区与 canvas 文字错位。 */
    --min-font-size: 1;
    --text-scale-factor: calc(var(--total-scale-factor) * var(--min-font-size));
    --min-font-size-inv: calc(1 / var(--min-font-size));
  }
  .textLayer span, .textLayer br {
    /* M7: color:transparent 与官方 text_layer_builder.css 一致。iOS Safari 的 WKTextInteraction
       长按命中测试对"已布局文字字形"做检测，与 color 无关（官方 pdf.js 就用 transparent 且 iOS 能选）。
       真正让 iOS 命中 textLayer 的是容器 tabIndex=0（见 layoutPages）+ overflow:clip + caret-color。
       -webkit-touch-callout 不设（default，与官方一致）--设 none 会让 iOS 长按不触发正常选词放大镜，
       而是触发 select-all（选整页），这是第四轮修复的关键发现。系统菜单仍弹，selectionchange 触发高亮菜单。 */
    color: transparent;
    position: absolute; white-space: pre; cursor: text;
    transform-origin: 0% 0%;
    -webkit-user-select: text; user-select: text;
  }
  /* 叶子 span：pdf.js v6.2.108 在 span inline style 设 left/top(百分比)/--font-height/--scale-x/font-family，
     宿主 CSS 提供 font-size:calc(var(--text-scale-factor)*var(--font-height)) 与 transform:scaleX(var(--scale-x))
     （官方 pdf_viewer.css 规则，见 .textLayer 变量链）。漏这两条则 fontSize 回退 16px、无 scaleX -> 选区错位。 */
  .textLayer > :not(.markedContent),
  .textLayer .markedContent span:not(.markedContent) {
    z-index: 1; /* pdf.js 官方：leaf span z-index:1，在 endOfContent(z-index:0) 之上 */
    --font-height: 0;
    font-size: calc(var(--text-scale-factor) * var(--font-height));
    --scale-x: 1;
    --rotate: 0deg;
    transform: rotate(var(--rotate)) scaleX(var(--scale-x)) scale(var(--min-font-size-inv));
  }
  .textLayer .markedContent { display: contents; }
  .textLayer ::selection { background: rgba(201,169,110,0.35); }
  /* pdf.js endOfContent：约束选区在 textLayer 内，拖到边界时扩展到页末而不是跳到 UI（顶栏"笔记"按钮等）。
     pdf.js v6 核心 TextLayer.render 不创建该 div（TextLayerBuilder 才创建），本应用在 renderTextLayer 手动 append。
     z-index:0 对齐官方 text_layer_builder.css（非 -1）。.selecting 时 top:0 让 endOfContent 盖满整层；
     但 onReaderSelectionChange 的 Safari 分支会 inline 设 userSelect:'text' 覆盖此处的 user-select:none，
     并把它挪到 anchor 旁，使选区扩展时端点落在紧邻 anchor 的可选元素而非逃逸到 UI（官方同设计）。 */
  .textLayer .endOfContent {
    display: block; position: absolute; inset: 100% 0 0; z-index: 0;
    cursor: default; -webkit-user-select: none; user-select: none;
  }
  .textLayer.selecting .endOfContent {
    top: 0;
  }
  .textLayer mark.hl {
    color: transparent; border-radius: 1px; padding: 0; cursor: pointer;
  }
  /* v2 翻译：已译句可点叠层（极淡 jade 下划线提示可点）+ 点句高亮底 + ZH 浮层 */
  .textLayer span.tr-sent {
    position: static; /* 覆盖 .textLayer span 的 absolute，保持 inline（同 mark.hl） */
    cursor: text; border-radius: 1px; /* P2：去 pointer，句尾图标承担点击，tr-sent 回归可选词文本 */
    -webkit-tap-highlight-color: transparent;
  }
  .textLayer span.tr-sent.tr-active { background: var(--jade-bg); }
  /* v2 翻译句内连续底线（overlay）：pdf.js 每词一 span，tr-sent 片段间有词间 gap，
     border-bottom 会断续；改用绝对定位 overlay 层按句每行画连续 1px 线覆盖 gap */
  .textLayer .tr-underline-layer { position: absolute; inset: 0; pointer-events: none; }
  .textLayer .tr-underline { position: absolute; height: 1px; background: var(--jade-line); pointer-events: none; }
  .textLayer .tr-underline.tr-active { background: var(--jade); }
  /* P2 句尾图标：overlay 层内独立可点小图标（书页角 SVG，古铜金），单击弹该句译文，绕开 textLayer 选词冲突 */
  .textLayer .tr-icon {
    position: absolute; pointer-events: auto; cursor: pointer;
    width: 14px; height: 14px; opacity: 0.55;
    -webkit-tap-highlight-color: transparent;
    transition: opacity .12s;
  }
  .textLayer .tr-icon:hover, .textLayer .tr-icon.tr-icon-active { opacity: 1; }
  .textLayer .tr-icon svg { width: 100%; height: 100%; display: block; stroke: var(--accent); fill: none; stroke-width: 1.2; stroke-linejoin: round; }
  .reader-tr-popup {
    position: fixed; z-index: 60; max-width: 84vw;
    background: var(--surface-2); color: var(--jade);
    border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 14px; font-size: 15px; line-height: 1.5;
    box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    -webkit-tap-highlight-color: transparent;
  }
  .reader-translate-btn[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .reader-tr-status {
    color: var(--muted); font-size: 12px; min-width: 0; flex-shrink: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .reader-tr-status:empty { display: none; } /* tr 关时无文本不占 gap */
  /* 高亮菜单（M4） */
  .hl-menu {
    position: fixed; z-index: 50; display: flex; align-items: center; gap: 6px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.5);
  }
  .hl-swatch {
    width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--border);
    cursor: pointer; padding: 0;
  }
  .hl-swatch.sel { border-color: var(--text); box-shadow: 0 0 0 2px var(--accent); }
  .hl-menu input {
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 4px; padding: 4px 6px; font-size: 13px; width: 130px;
  }
  .hl-delete { background: var(--danger); color: #fff; border: none; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
  /* 阅读器笔记面板（M4） */
  .reader-notes {
    position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom));
    z-index: 45; width: min(420px, 92vw); background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px; padding: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 8px;
  }
  .reader-notes textarea {
    width: 100%; min-height: 140px; resize: vertical; box-sizing: border-box;
    background: var(--surface-2); color: var(--text); border: 1px solid var(--border);
    border-radius: 6px; padding: 8px; font-size: 14px; font-family: inherit; line-height: 1.5;
  }
  .reader-notes-actions { display: flex; justify-content: flex-end; gap: 8px; }
  /* 编辑器批注汇总（M4） */
  .anno-list { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; }
  .anno-item {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 6px 8px; font-size: 12px; cursor: pointer;
  }
  .anno-item .anno-meta { color: var(--muted); font-size: 11px; margin-bottom: 2px; }
  .anno-item .anno-text { color: var(--text); }
  .anno-item .anno-note { color: var(--accent); margin-top: 2px; }
  .anno-empty { color: var(--muted); font-size: 12px; padding: 4px 0; }
</style>
</head>
<body>
<header>
  <h1>论文阅读</h1>
  <button class="settings-btn" id="settings-btn" aria-label="设置">⚙</button>
  <nav class="tabs">
    <button data-tab="feed">今日推荐</button>
    <button data-tab="queue" class="active">阅读队列</button>
    <button data-tab="archive">已读归档</button>
  </nav>
</header>

<main>
  <section id="tab-feed" class="tab-panel" style="display:none">
    <div class="feed-toolbar">
      <span id="feed-status" class="feed-status"></span>
      <button type="button" class="btn-secondary" id="feed-refresh">刷新推荐</button>
    </div>
    <div id="list-feed"></div>
  </section>
  <section id="tab-queue" class="tab-panel">
    <div id="list-queue"></div>
  </section>
  <section id="tab-archive" class="tab-panel" style="display:none">
    <div id="list-archive"></div>
  </section>
</main>

<button class="fab" id="add-btn" aria-label="新增论文">+</button>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <h2 id="modal-title">新增论文</h2>
    <p class="hint" id="modal-hint"></p>
    <input type="hidden" id="f-id">
    <label>标题 *</label>
    <input id="f-title" placeholder="论文标题">
    <label>作者（逗号分隔）</label>
    <input id="f-authors" placeholder="Author A, Author B">
    <label>来源</label>
    <select id="f-source">
      <option value="manual">手动录入</option>
      <option value="url">URL（其它网站 PDF / 页面）</option>
      <option value="arxiv">arXiv（链接 / ID）</option>
      <option value="local">本地 PDF 文件</option>
    </select>
    <div id="src-arxiv" class="src-fields" style="display:none">
      <label>arXiv 链接或 ID</label>
      <div class="row">
        <input id="f-arxiv-input" placeholder="https://arxiv.org/abs/1706.03762 或 1706.03762">
        <button type="button" id="f-arxiv-fetch" class="btn-secondary" style="flex:0 0 auto">拉取</button>
      </div>
    </div>
    <div id="src-local" class="src-fields" style="display:none">
      <label>PDF 文件</label>
      <input type="file" id="f-file" accept="application/pdf">
    </div>
    <label>URL</label>
    <input id="f-url" placeholder="https://...">
    <label>摘要</label>
    <textarea id="f-abstract" placeholder="摘要（可选）"></textarea>
    <label>状态</label>
    <select id="f-status">
      <option value="want">想读</option>
      <option value="reading">在读</option>
      <option value="done">已读</option>
      <option value="abandoned">弃读</option>
    </select>
    <label>评分</label>
    <div class="star-input" id="f-rating">
      <span class="star" data-v="1">★</span><span class="star" data-v="2">★</span><span class="star" data-v="3">★</span><span class="star" data-v="4">★</span><span class="star" data-v="5">★</span>
      <span class="clr">清除</span>
    </div>
    <label>标签（逗号分隔）</label>
    <input id="f-tags" placeholder="transformer, nlp">
    <label>笔记（Markdown）</label>
    <textarea id="f-notes" placeholder="阅读笔记..."></textarea>
    <label>批注汇总</label>
    <div class="anno-list" id="anno-list"></div>
    <div class="btns">
      <button class="btn-secondary" id="cancel-btn">取消</button>
      <button class="btn-primary" id="save-btn">保存</button>
    </div>
  </div>
</div>

<!-- 设置页（M5）：订阅管理 -->
<div class="overlay" id="settings-overlay">
  <div class="modal" id="settings-modal">
    <h2>设置</h2>
    <div id="acct-section" style="border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:12px">
      <label>账号同步（Supabase）</label>
      <div id="acct-loggedout">
        <input id="acct-email" type="email" placeholder="邮箱" autocomplete="email">
        <input id="acct-pass" type="password" placeholder="密码" autocomplete="current-password" style="margin-top:6px">
        <div class="btns" style="margin-top:8px">
          <button class="btn-primary" id="acct-login">登录</button>
          <button class="btn-secondary" id="acct-signup">注册</button>
        </div>
        <div class="hint" id="acct-msg"></div>
      </div>
      <div id="acct-loggedin" style="display:none">
        <div class="hint" id="acct-user"></div>
        <button class="btn-secondary" id="acct-logout" style="margin-top:8px;padding:8px 14px;font-size:13px">登出</button>
      </div>
    </div>
    <div id="translate-section" style="border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:12px">
      <label>翻译（DeepSeek）</label>
      <div id="translate-loggedout" class="hint" style="padding:4px 0">登录后可填 DeepSeek API key，启用阅读器正文翻译。</div>
      <div id="translate-loggedin" style="display:none">
        <input id="deepseek-key" type="password" placeholder="sk-...（DeepSeek API key）" autocomplete="off" style="margin-top:6px">
        <div class="hint" style="margin-top:4px">key 存 Supabase（user_secrets 表，仅自己可读），经 Edge Function 代理转发 DeepSeek；不进前端持久状态、不进 git，跨设备同步。</div>
        <div class="btns" style="margin-top:8px">
          <button class="btn-primary" id="deepseek-save">保存</button>
          <button class="btn-secondary" id="deepseek-show" style="font-size:13px;padding:8px 14px">显示</button>
        </div>
        <div class="hint" id="deepseek-msg"></div>
      </div>
    </div>
    <label>订阅管理（日推来源）</label>
    <div id="sub-list"></div>
    <button type="button" class="btn-secondary" id="sub-add" style="margin-top:8px;padding:8px 14px;font-size:13px">+ 新增订阅</button>
    <div id="sub-editor" style="display:none">
      <h3 id="sub-editor-title">新增订阅</h3>
      <label>名称</label>
      <input id="sub-name" placeholder="如：NLP 前沿">
      <label>arXiv 分类（多选）</label>
      <div class="cat-picker" id="sub-cats"></div>
      <label>关键词组（组内逗号 = OR，组间 = AND；留空 = 只按分类拉）</label>
      <div id="sub-keywords"></div>
      <button type="button" class="btn-secondary" id="sub-kw-addgrp" style="font-size:12px;padding:6px 12px">+ 新增关键词组</button>
      <label>启用</label>
      <select id="sub-enabled"><option value="true">启用</option><option value="false">停用</option></select>
      <div class="btns">
        <button class="btn-secondary" id="sub-cancel">取消</button>
        <button class="btn-primary" id="sub-save">保存订阅</button>
      </div>
    </div>
    <div class="btns">
      <button class="btn-primary" id="settings-close">关闭</button>
    </div>
  </div>
</div>

<div class="reader" id="reader">
  <div class="reader-topbar">
    <button class="reader-close" id="reader-close" aria-label="关闭阅读器">✕</button>
    <span class="reader-pageinfo" id="reader-pageinfo"></span>
    <div class="reader-progress"><div id="reader-progress-fill"></div></div>
    <div class="reader-zoom">

<script>
// ===== IndexedDB：papers + pdfFiles + annotations（M3 加 pdfFiles，M4 加 annotations；§4.1/§4.2 子集；M6 接 Supabase 同步）=====
const DB_NAME = 'paper-reading';
const DB_VERSION = 6; // v6：v2 翻译 -- translations(逐页译文缓存)+ user_secrets(DeepSeek key) 两 store；schemaless 无结构迁移，旧库升 v6 时建空 store，syncPull 填充
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('papers')) {
        const s = d.createObjectStore('papers', { keyPath: 'id' });
        s.createIndex('status', 'status', { unique: false });
        s.createIndex('updated_at', 'updated_at', { unique: false });
      }
      // v2：本地 PDF 二进制 store（key = paper.id）
      if (!d.objectStoreNames.contains('pdfFiles')) {
        d.createObjectStore('pdfFiles', { keyPath: 'id' });
      }
      // v3：高亮批注 store（§4.2 annotations：id/paper_id/page/text/offsets/color/note/created_at）
      if (!d.objectStoreNames.contains('annotations')) {
        const a = d.createObjectStore('annotations', { keyPath: 'id' });
        a.createIndex('paper_id', 'paper_id', { unique: false });
      }
      // v4：M5 日推 -- 订阅 subscriptions（§4.3）+ 跳过 dismissed（§4.4）
      // subscriptions: {id,name,keywords:[[t1,t2],[t3]] 组内OR组间AND,categories:[cs.CL,...],enabled,created_at}
      // dismissed: {arxiv_id,dismissed_at} 跳过的推荐不再出现
      if (!d.objectStoreNames.contains('subscriptions')) {
        d.createObjectStore('subscriptions', { keyPath: 'id' });
      }
      if (!d.objectStoreNames.contains('dismissed')) {
        d.createObjectStore('dismissed', { keyPath: 'arxiv_id' });
      }
      // v5：M6 同步 -- 给现有 papers/annotations/subscriptions 补 _dirty=true（首次同步全量推）+ 补 updated_at（旧对象可能无）
      if (e.oldVersion < 5) {
        for (const sn of ['papers', 'annotations', 'subscriptions']) {
          if (!d.objectStoreNames.contains(sn)) continue;
          const os = e.target.transaction.objectStore(sn);
          os.openCursor().onsuccess = (ev) => {
            const c = ev.target.result;
            if (!c) return;
            const obj = c.value;
            let changed = false;
            if (obj._dirty === undefined) { obj._dirty = true; changed = true; }
            if (!obj.updated_at) { obj.updated_at = obj.created_at || nowISO(); changed = true; }
            if (changed) c.update(obj);
            c.continue();
          };
        }
      }
      // v6：v2 翻译 -- translations(逐页译文缓存,§11.4) + user_secrets(DeepSeek key,§11.3)
      // translations: {id,user_id,paper_id,scope:'page',page_num,pairs:[{en,zh}],source_hash,updated_at,deleted_at,_dirty}
      // user_secrets: {user_id,deepseek_key,updated_at,_dirty} 单行/用户
      if (!d.objectStoreNames.contains('translations')) {
        const tr = d.createObjectStore('translations', { keyPath: 'id' });
        tr.createIndex('paper_id', 'paper_id', { unique: false });
      }
      if (!d.objectStoreNames.contains('user_secrets')) {
        d.createObjectStore('user_secrets', { keyPath: 'user_id' });
      }
    };
    req.onsuccess = () => { db = req.result; resolve(db); };
    req.onerror = () => reject(req.error);
  });
}

function uid() {
  // RFC4122 v4 近似（Math.random，非加密强度；M6 同步时如需可换 crypto.randomUUID）
  if (crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, (c) => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}

function store(mode) { return db.transaction('papers', mode).objectStore('papers'); }

function dbAll() {
  return new Promise((resolve, reject) => {
    const req = store('readonly').getAll();
    req.onsuccess = () => resolve((req.result || []).filter((p) => !p.deleted_at));
    req.onerror = () => reject(req.error);
  });
}

function dbPut(paper) {
  if (!paper.updated_at) paper.updated_at = nowISO();
  paper._dirty = true;
  return new Promise((resolve, reject) => {
    const req = store('readwrite').put(paper);
    req.onsuccess = () => { schedulePush(); resolve(paper); };
    req.onerror = () => reject(req.error);
  });
}

// 软删（tombstone）：设 deleted_at + updated_at，syncPush 传播删除；dbAll 已过滤
function dbDelete(id) {
  return new Promise((resolve, reject) => {
    const t = db.transaction('papers', 'readwrite');
    const s = t.objectStore('papers');
    const g = s.get(id);
    g.onsuccess = () => {
      const p = g.result;
      if (!p) return;
      p.deleted_at = nowISO();
      p.updated_at = nowISO();
      p._dirty = true;
      s.put(p);
    };
    g.onerror = () => reject(g.error);
    t.oncomplete = () => { schedulePush(); resolve(); };
    t.onerror = () => reject(t.error);
  });
}

// pdfFiles store（M3）：存本地 PDF 二进制，key = paper.id；M6 同步时改走 Supabase Storage
function fileStore(mode) { return db.transaction('pdfFiles', mode).objectStore('pdfFiles'); }

function dbPutFile(file) {
  return new Promise((resolve, reject) => {
    const req = fileStore('readwrite').put(file);
    req.onsuccess = () => resolve(file);
    req.onerror = () => reject(req.error);
  });
}

function dbGetFile(id) {
  return new Promise((resolve, reject) => {
    const req = fileStore('readonly').get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

function dbDeleteFile(id) {
  return new Promise((resolve, reject) => {
    const req = fileStore('readwrite').delete(id);
    req.onsuccess = () => resolve();
    req.onerror = () => reject(req.error);
  });
}

// annotations store（M4）：高亮批注，§4.2。key=id，索引 paper_id
function annoStore(mode) { return db.transaction('annotations', mode).objectStore('annotations'); }

function dbPutAnno(a) {
  if (!a.updated_at) a.updated_at = nowISO();
  a._dirty = true;
  return new Promise((resolve, reject) => {
    const req = annoStore('readwrite').put(a);

function dbDeleteAnno(id) {

      const a = g.result;

}

// 软删某条目全部批注（删论文时调用）
function dbDeleteAnnosByPaper(paperId) {
  return dbGetAnnosByPaper(paperId).then((annos) =>
    Promise.all(annos.map((a) => dbDeleteAnno(a.id)))

// subscriptions store（M5 §4.3）：日推订阅。key=id
// {id, name, keywords:[[t1,t2],[t3]] 组内OR组间AND, categories:[cs.CL,...], enabled, created_at}
function subStore(mode) { return db.transaction('subscriptions', mode).objectStore('subscriptions'); }

function dbPutSub(sub) {
  if (!sub.updated_at) sub.updated_at = nowISO();
  sub._dirty = true;
  return new Promise((resolve, reject) => {
    const req = subStore('readwrite').put(sub);

    req.onerror = () => reject(req.error);

}

function dbGetAllSubs() {

function dbDelSub(id) {
  return new Promise((resolve, reject) => {
    const t = db.transaction('subscriptions', 'readwrite');

// dismissed store（M5 §4.4）：日推跳过的论文。key=arxiv_id，跳过后不再出现在推荐
function dismissStore(mode) { return db.transaction('dismissed', mode).objectStore('dismissed'); }

// translations store（v2 §11.4）：逐页译文缓存。key=id(uuid)，索引 paper_id
// {id, user_id, paper_id, scope:'page', page_num, pairs:[{en,zh}], source_hash, updated_at, deleted_at, _dirty}
function trStore(mode) { return db.transaction('translations', mode).objectStore('translations'); }

// 写/更新一页译文（同 paper+page 复用既有 id 更新，不产生重复行；source_hash 变则重译覆盖）
function dbPutTranslation(t) {
  if (!t.updated_at) t.updated_at = nowISO();
  if (!t.scope) t.scope = 'page';
  t._dirty = true;
  return new Promise((resolve, reject) => {
    const req = trStore('readwrite').put(t);
    req.onsuccess = () => { schedulePush(); resolve(t); };
    req.onerror = () => reject(req.error);
  });
}

// 取某页译文：同 paper 多行（多设备可能各译一次）取未删的最新一条
function dbGetTranslation(paperId, pageNum) {
  return new Promise((resolve, reject) => {
    const idx = trStore('readonly').index('paper_id');
    const req = idx.getAll(paperId);
    req.onsuccess = () => {
      const rows = (req.result || []).filter((r) => !r.deleted_at && r.page_num === pageNum);
      rows.sort((a, b) => tsOf(b.updated_at) - tsOf(a.updated_at));
      resolve(rows[0] || null);
    };
    req.onerror = () => reject(req.error);
  });
}

// 取某篇全部已译页（reader 预译时读缓存；同 page 取最新）
function dbGetAllTranslations(paperId) {
  return new Promise((resolve, reject) => {
    const idx = trStore('readonly').index('paper_id');
    const req = idx.getAll(paperId);
    req.onsuccess = () => {
      const rows = (req.result || []).filter((r) => !r.deleted_at);
      const byPage = {};
      for (const r of rows) {
        const k = r.page_num;
        if (!byPage[k] || tsOf(r.updated_at) > tsOf(byPage[k].updated_at)) byPage[k] = r;
      }
      resolve(Object.values(byPage));
    };
    req.onerror = () => reject(req.error);
  });
}

// 软删某论文全部译文（删论文时调用；单事务批量，含同 page 多设备多行不去重）
function dbDeleteTranslationsByPaper(paperId) {
  return new Promise((resolve, reject) => {
    const t = db.transaction('translations', 'readwrite');
    const s = t.objectStore('translations');
    const now = nowISO();
    const req = s.index('paper_id').getAll(paperId);
    req.onsuccess = () => {
      const rows = (req.result || []).filter((r) => !r.deleted_at);
      for (const r of rows) { r.deleted_at = now; r.updated_at = now; r._dirty = true; s.put(r); }
    };
    req.onerror = () => reject(req.error);
    t.oncomplete = () => { if (req.result && req.result.length) schedulePush(); resolve(); };
    t.onerror = () => reject(t.error);
  });
}

// 清孤儿译文：paper_id 不在 live papers（已软删或不存在）的译文行软删。syncPull 后调（本地 papers 已最新）。
function trPurgeOrphans() {
  return new Promise((resolve, reject) => {
    const t = db.transaction(['papers', 'translations'], 'readwrite');
    const ps = t.objectStore('papers');
    const ts = t.objectStore('translations');
    const now = nowISO();
    let orphans = 0;
    const gp = ps.getAll();
    gp.onsuccess = () => {
      const live = new Set((gp.result || []).filter((p) => !p.deleted_at).map((p) => p.id));
      const gt = ts.getAll();
      gt.onsuccess = () => {
        const rows = (gt.result || []).filter((r) => !r.deleted_at && !live.has(r.paper_id));
        orphans = rows.length;
        for (const r of rows) { r.deleted_at = now; r.updated_at = now; r._dirty = true; ts.put(r); }
      };
      gt.onerror = () => reject(gt.error);
    };
    gp.onerror = () => reject(gp.error);
    t.oncomplete = () => { if (orphans) schedulePush(); resolve(orphans); };
    t.onerror = () => reject(t.error);
  });
}

// user_secrets store（v2 §11.3）：DeepSeek key，单行/用户。key=user_id
// {user_id, deepseek_key, updated_at, _dirty}；跨设备共享（Mac 填过 iPhone 不用重填）
function secretStore(mode) { return db.transaction('user_secrets', mode).objectStore('user_secrets'); }

function dbPutSecret(row) {
  if (!row.updated_at) row.updated_at = nowISO();
  row._dirty = true;
  return new Promise((resolve, reject) => {
    const req = secretStore('readwrite').put(row);
    req.onsuccess = () => { schedulePush(); resolve(row); };
    req.onerror = () => reject(req.error);
  });
}

function dbGetSecret(userId) {
  return new Promise((resolve, reject) => {
    const req = secretStore('readonly').get(userId);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}

// ===== 模型 =====
const STATUS_LABEL = { want: '想读', reading: '在读', done: '已读', abandoned: '弃读' };

function nowISO() { return new Date().toISOString(); }

function parseList(str) {
  return (str || '').split(',').map((s) => s.trim()).filter(Boolean);
}

// 评分输入的模块级状态（编辑器复用）
let currentRating = 0;
let editingId = null;     // 当前编辑条目 id；null=新增
let editingPaper = null;  // 编辑时保留旧条目（保住 arxiv_id/local_file_path/read_progress/added_at）
let currentArxivId = null;  // M3：arXiv 拉取到的 id（保存时写入 paper.arxiv_id）
let currentFileData = null; // M3：本地 PDF 选中后的 ArrayBuffer（保存时写入 pdfFiles store）

function makePaperFromForm() {
  const existing = editingId ? (editingPaper || {}) : {};
  const src = document.getElementById('f-source').value;
  return {
    id: document.getElementById('f-id').value || uid(),
    title: document.getElementById('f-title').value.trim(),
    authors: parseList(document.getElementById('f-authors').value),
    abstract: document.getElementById('f-abstract').value.trim() || null,
    source_type: src,
    arxiv_id: (src === 'arxiv' && currentArxivId) ? currentArxivId : (existing.arxiv_id || null),
    url: document.getElementById('f-url').value.trim() || null,
    local_file_path: src === 'local' ? (existing.local_file_path || 'local') : null,
    status: document.getElementById('f-status').value,
    rating: currentRating || null,
    tags: parseList(document.getElementById('f-tags').value),
    notes_md: document.getElementById('f-notes').value,
    read_progress: existing.read_progress || 0,
    added_at: existing.added_at || nowISO(),
    updated_at: nowISO()
  };
}

// ===== 渲染 =====
function stars(n) {
  n = n || 0;
  return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n);
}

function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

function safeUrl(u) { return /^https?:\/\//i.test(u || ''); }

function statusActions(status) {
  // 全部状态可互转（计划书 §4.1：想读/在读/已读/弃读 全可逆）
  const btns = [];
  if (status !== 'reading') btns.push('<button data-status="reading">设为在读</button>');
  if (status !== 'want') btns.push('<button data-status="want">设为想读</button>');
  if (status !== 'done') btns.push('<button data-status="done">设为已读</button>');
  if (status !== 'abandoned') btns.push('<button data-status="abandoned">弃读</button>');
  return btns.join('');
}

function canRead(p) {
  // local：本地 PDF 存在即读（openReader 内再校验）；arXiv/url：需可解析的 http(s) PDF 链接
  if (p.source_type === 'local') return true;
  const u = resolvePdfUrl(p);
  return !!u && /^https?:\/\//i.test(u);
}

function renderCard(p) {
  const el = document.createElement('div');
  el.className = 'card';
  const tagsHtml = (p.tags || []).map((t) => `<span class="tag">${escapeHtml(t)}</span>`).join('');
  let urlHtml = '';
  if (p.url) {
    urlHtml = safeUrl(p.url)
      ? `<div class="url-line"><a class="url-link" href="${escapeHtml(p.url)}" target="_blank" rel="noopener">${escapeHtml(p.url)}</a></div>`
      : `<div class="url-line"><span class="url-text">${escapeHtml(p.url)}</span></div>`;
  }
  el.innerHTML =
    `<div class="title">${escapeHtml(p.title)}</div>` +
    `<div class="authors">${escapeHtml((p.authors || []).join(', '))}</div>` +
    `<div class="meta">` +
      `<span class="badge status-${p.status}">${STATUS_LABEL[p.status] || p.status}</span>` +
      (p.rating ? `<span class="stars">${stars(p.rating)}</span>` : '') +
      tagsHtml +
    `</div>` +
    urlHtml +
    `<div class="actions">` +
      (canRead(p) ? `<button data-act="read">阅读</button>` : '') +
      `<button data-act="edit">编辑</button>` +
      statusActions(p.status) +
      `<button data-act="delete" class="danger">删除</button>` +
    `</div>`;
  el.querySelector('[data-act="edit"]').addEventListener('click', () => openEditor(p));
  el.querySelector('[data-act="delete"]').addEventListener('click', () => del(p));
  const readBtn = el.querySelector('[data-act="read"]');
  if (readBtn) readBtn.addEventListener('click', () => openReader(p));
  el.querySelectorAll('[data-status]').forEach((b) => {
    b.addEventListener('click', () => changeStatus(p, b.dataset.status));
  });
  return el;
}

function sortPapers(list) {
  // 在读优先，想读其次，已读/弃读最后；同状态按 updated_at 倒序
  const rank = { reading: 0, want: 1, done: 2, abandoned: 3 };
  return list.slice().sort((a, b) => {
    if (rank[a.status] !== rank[b.status]) return rank[a.status] - rank[b.status];
    return (b.updated_at || '').localeCompare(a.updated_at || '');
  });
}

function renderList(elId, list) {
  const el = document.getElementById(elId);
  el.innerHTML = '';
  if (list.length === 0) {
    el.innerHTML = '<div class="empty">暂无条目</div>';
    return;
  }
  list.forEach((p) => el.appendChild(renderCard(p)));
}

async function render() {
  const all = await dbAll();
  const queue = sortPapers(all.filter((p) => p.status === 'want' || p.status === 'reading'));
  const archive = sortPapers(all.filter((p) => p.status === 'done' || p.status === 'abandoned'));
  renderList('list-queue', queue);
  renderList('list-archive', archive);
}

// ===== 编辑器 =====

  document.querySelectorAll('#f-rating span.star').forEach((s) => {

// 批注汇总（M4）：列该条目全部高亮，点击跳阅读器对应页，附删除
async function renderAnnoList(paperId) {
  const el = document.getElementById('anno-list');
  if (!el) return;
  if (!paperId) { el.innerHTML = '<div class="anno-empty">新增条目尚无批注（阅读时选中文字可加）。</div>'; return; }
  let annos = [];
  try { annos = await dbGetAnnosByPaper(paperId); } catch (e) { annos = []; }
  annos.sort((a, b) => a.page - b.page || a.start_offset - b.start_offset);
  if (annos.length === 0) { el.innerHTML = '<div class="anno-empty">暂无批注。</div>'; return; }
  el.innerHTML = '';
  for (const a of annos) {
    const item = document.createElement('div');
    item.className = 'anno-item';
    const text = a.text || '';
    const excerpt = text.slice(0, 60) + (text.length > 60 ? '…' : '');
    item.innerHTML =
      '<div class="anno-meta">第 ' + a.page + ' 页 · ' + (a.color === 'yellow' ? '黄' : '青') + '</div>' +
      '<div class="anno-text">' + escapeHtml(excerpt) + '</div>' +
      (a.note ? '<div class="anno-note">批注：' + escapeHtml(a.note) + '</div>' : '');
    item.addEventListener('click', async () => {
      closeEditor();
      const all = await dbAll();
      const paper = all.find((x) => x.id === a.paper_id);
      if (paper) openReader(paper, a.page);
    });
    const delBtn = document.createElement('button');
    delBtn.className = 'hl-delete';
    delBtn.textContent = '删';
    delBtn.style.cssText = 'margin-top:4px;padding:2px 8px;font-size:11px';
    delBtn.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      if (!confirm('删除这条批注？')) return;
      await dbDeleteAnno(a.id).catch(() => {});
      renderAnnoList(paperId);
    });
    item.appendChild(delBtn);
    el.appendChild(item);
  }
}

function openEditor(p) {
  p = p || null;
  editingId = p ? p.id : null;
  editingPaper = p || null;
  currentArxivId = p ? (p.arxiv_id || null) : null;
  currentFileData = null;
  document.getElementById('modal-title').textContent = p ? '编辑论文' : '新增论文';
  document.getElementById('modal-hint').textContent = p
    ? '修改后保存即更新该条目。'
    : '可手动录入；或选「arXiv」一键拉取元数据，选「本地 PDF 文件」导入。';
  document.getElementById('f-id').value = p ? p.id : '';
  document.getElementById('f-title').value = p ? (p.title || '') : '';
  document.getElementById('f-authors').value = p ? (p.authors || []).join(', ') : '';
  document.getElementById('f-source').value = p ? (p.source_type || 'manual') : 'manual';
  document.getElementById('f-arxiv-input').value = p && p.arxiv_id ? p.arxiv_id : '';
  document.getElementById('f-file').value = '';
  document.getElementById('f-url').value = p ? (p.url || '') : '';

  document.getElementById('f-notes').value = p ? (p.notes_md || '') : '';

  renderAnnoList(p ? p.id : null);
  document.getElementById('overlay').classList.add('show');

function closeEditor() {

}

async function save() {
  const paper = makePaperFromForm();
  if (!paper.title) { alert('请填写标题'); return; }
  // 本地 PDF：新增条目必须选了文件
  if (paper.source_type === 'local' && !currentFileData && !editingId) {
    alert('请选择本地 PDF 文件。'); return;
  }
  try {
    await dbPut(paper);
    // 本地 PDF：有新选文件就写入 pdfFiles（key=paper.id，离线缓存）
    if (paper.source_type === 'local' && currentFileData) {
      await dbPutFile({
        id: paper.id,
        data: currentFileData,
        size: currentFileData.byteLength,
        added_at: nowISO()
      });
    }
    // 来源从 local 改成其它：清理旧 pdfFile + Storage 对象（Storage 删除非阻塞，失败不阻塞 UI）
    if (paper.source_type !== 'local' && editingId) {
      await dbDeleteFile(paper.id).catch(() => {});
      if (sbSession()) sbDeletePdf(paper.id).catch(() => {});
    }
    // M8 修复：本地保存成功后立即关编辑器 + render。Storage 上传改后台非阻塞
    // （之前 await sbUploadPdf 挂起/抛错会导致论文已存但添加页面不关）。
    const uploadFile = currentFileData;
    const uploadId = paper.id;
    currentFileData = null;
    currentArxivId = null;
    closeEditor();
    render();
    if (paper.source_type === 'local' && uploadFile && sbSession()) {
      sbUploadPdf(uploadId, uploadFile).then((ok) => {
        if (!ok) alert('PDF 已存本地，但上传云端失败。可稍后重新编辑保存以重试上传。');
      }).catch(() => {
        alert('PDF 已存本地，但上传云端失败。可稍后重新编辑保存以重试上传。');
      });
    }
  } catch (err) {
    alert('保存失败：' + (err && err.message ? err.message : err));
  }
}

async function del(p) {
  if (!confirm(`删除「${p.title}」？此操作不可撤销。`)) return;
  await dbDelete(p.id);
  await dbDeleteFile(p.id).catch(() => {}); // 本地 PDF 二进制一并删
  if (sbSession()) await sbDeletePdf(p.id).catch(() => {}); // Storage 对象一并删
  await dbDeleteAnnosByPaper(p.id).catch(() => {}); // 高亮批注一并删
  await dbDeleteTranslationsByPaper(p.id).catch(() => {}); // 逐页译文缓存一并软删（防孤儿泄漏）
  render();
}

async function changeStatus(p, status) {

  await dbPut(p);
  render();
}

async function renderSubList() {
  const subs = await dbGetAllSubs().catch(() => []);
  const el = document.getElementById('sub-list');
  if (!subs.length) {
    el.innerHTML = '<div class="empty" style="padding:12px 0">还没有订阅。点下方「+ 新增订阅」添加一个 arXiv 分类订阅，日推会每天拉最新投稿。</div>';
    return;
  }
  el.innerHTML = subs.map((s) => {
    const cats = (s.categories || []).join(', ') || '（无分类）';
    const kwGroups = (s.keywords || []).filter((g) => g && g.length).map((g) => g.join(' | '));
    const kw = kwGroups.join('  AND  ');
    return `<div class="sub-item" data-id="${escapeHtml(s.id)}">
      <div class="sub-name">${escapeHtml(s.name || '')}<span class="sub-meta">${escapeHtml(cats)}${kw ? ' · ' + escapeHtml(kw) : ''}</span></div>

function renderCatPicker(selected) {
  const sel = new Set(selected || []);
  // 预设分组 checkbox
  const groupsHtml = ARXIV_CAT_GROUPS.map((g) =>
    `<div class="cat-group"><div class="cat-group-title">${escapeHtml(g.group)}</div><div class="cat-group-chips">` +
    g.cats.map((c) =>
      `<label><input type="checkbox" value="${escapeHtml(c.id)}" ${sel.has(c.id) ? 'checked' : ''}>${escapeHtml(c.name)}</label>`
    ).join('') + `</div></div>`
  ).join('');
  // 自定义手输：已保存但不在预设列表里的分类回填到输入框
  const presetIds = new Set(ARXIV_CAT_GROUPS.flatMap((g) => g.cats.map((c) => c.id)));
  const custom = [...sel].filter((id) => !presetIds.has(id));
  document.getElementById('sub-cats').innerHTML = groupsHtml +
    `<div class="cat-group"><div class="cat-group-title">自定义分类</div>` +
    `<input type="text" id="sub-cat-custom" placeholder="手输 arXiv 分类，逗号分隔（如 q-bio.NC, stat.AP）" value="${escapeHtml(custom.join(', '))}">` +
    `<div style="font-size:11px;color:var(--muted);margin-top:4px">完整分类见 arxiv.org/category_taxonomy</div></div>`;
}

function renderKeywordGroups(keywords) {
  const kws = (keywords && keywords.length) ? keywords : [[]];
  document.getElementById('sub-keywords').innerHTML = kws.map((g) =>
    `<div class="kw-group"><input class="kw-input" placeholder="关键词，逗号分隔（组内 OR）" value="${escapeHtml((g || []).join(', '))}"><button type="button" class="btn-secondary kw-del" data-act="kw-del">✕</button></div>`
  ).join('');
}

async function saveSub() {
  const name = document.getElementById('sub-name').value.trim();
  if (!name) { alert('请填写订阅名称'); return; }
  const checked = [...document.querySelectorAll('#sub-cats input[type=checkbox]:checked')].map((c) => c.value);
  const customEl = document.getElementById('sub-cat-custom');
  const custom = customEl ? customEl.value.split(',').map((t) => t.trim()).filter(Boolean) : [];
  const categories = [...new Set([...checked, ...custom])];
  if (!categories.length) { alert('请至少选一个 arXiv 分类'); return; }
  const keywords = [...document.querySelectorAll('#sub-keywords .kw-group')]
    .map((g) => g.querySelector('.kw-input').value.split(',').map((t) => t.trim()).filter(Boolean))
    .filter((g) => g.length);
  const enabled = document.getElementById('sub-enabled').value === 'true';
  const sub = {
    id: editingSub ? editingSub.id : uid(),
    name, keywords, categories, enabled,
    created_at: editingSub ? (editingSub.created_at || nowISO()) : nowISO(),
  };
  try {
    await dbPutSub(sub);
    closeSubEditor();
    renderSubList();
  } catch (e) {
    alert('保存订阅失败：' + (e && e.message ? e.message : e));
  }
}

async function deleteSub(id) {
  const subs = await dbGetAllSubs().catch(() => []);
  const s = subs.find((x) => x.id === id);
  if (!confirm(`删除订阅「${s ? s.name : id}」？`)) return;
  await dbDelSub(id).catch(() => {});
  renderSubList();
}

async function toggleSub(id) {
  const subs = await dbGetAllSubs().catch(() => []);
  const s = subs.find((x) => x.id === id);
  if (!s) return;
  s.enabled = !s.enabled;
  await dbPutSub(s).catch(() => {});
  renderSubList();
}

function sbHeaders(token) {
  const h = { apikey: SUPABASE_KEY, 'Content-Type': 'application/json' };
  if (token) h['Authorization'] = 'Bearer ' + token;
  return h;
}
function sbSession() {
  try { return JSON.parse(localStorage.getItem('sb_session') || 'null'); } catch { return null; }
}
function sbSaveSession(s) { localStorage.setItem('sb_session', JSON.stringify(s)); }
function sbClearSession() { localStorage.removeItem('sb_session'); }

async function sbSignup(email, password) {
  const res = await fetch(SB_AUTH + '/signup', {
    method: 'POST', headers: sbHeaders(null),
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.msg || data.message || data.error_description || '注册失败');
  if (data.access_token) sbSaveSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user });
  return data;
}
async function sbLogin(email, password) {
  const res = await fetch(SB_AUTH + '/token?grant_type=password', {
    method: 'POST', headers: sbHeaders(null),
    body: JSON.stringify({ email, password }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.msg || data.message || data.error_description || '登录失败');
  sbSaveSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user });

  if (s && s.access_token) {
    try { await fetch(SB_AUTH + '/logout', { method: 'POST', headers: sbHeaders(s.access_token) }); } catch (e) {}
  }
  sbClearSession();
}
async function sbRefresh() {
  const s = sbSession();
  if (!s || !s.refresh_token) return null;
  const res = await fetch(SB_AUTH + '/token?grant_type=refresh_token', {
    method: 'POST', headers: sbHeaders(null),
    body: JSON.stringify({ refresh_token: s.refresh_token }),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { sbClearSession(); return null; }
  sbSaveSession({ access_token: data.access_token, refresh_token: data.refresh_token, user: data.user });
  return data;
}

  } else {
    out.style.display = 'block';
    inn.style.display = 'none';
    input.value = '';
    setDeepseekMsg('', false);
  }
}

// ===== 同步引擎（M6 §3.7：pull/push 四表 LWW + tombstone 软删除 + 防抖推送）=====
const SYNC_TABLES = [
  { table: 'papers', store: 'papers' },
  { table: 'annotations', store: 'annotations' },
  { table: 'subscriptions', store: 'subscriptions' },
  { table: 'translations', store: 'translations' }, // v2 翻译：逐页译文缓存,uuid id 走通用 LWW
];
let pushTimer = null;

function schedulePush() {
  if (!sbSession()) return; // 未登录不 push
  if (pushTimer) clearTimeout(pushTimer);
  pushTimer = setTimeout(() => { syncPush().catch((e) => console.warn('push failed:', e.message)); }, 2000);
}
let pushing = false; // syncPush 并发守卫
function tsOf(v) { const t = new Date(v).getTime(); return isNaN(t) ? 0 : t; }

// fetch 包装：401（token 过期）自动 sbRefresh 重试一次（BUG 8）
async function sbFetch(url, opts) {
  let res = await fetch(url, opts);
  if (res.status === 401) {
    const refreshed = await sbRefresh();
    if (refreshed) {
      opts = Object.assign({}, opts, { headers: Object.assign({}, opts.headers, { Authorization: 'Bearer ' + refreshed.access_token }) });
      res = await fetch(url, opts);
    }
  }
  return res;
}

// 直接读写（绕过 schedulePush，供 syncPull/syncPush 内部用；rawPut 标记 _dirty=false 表示已同步）
function rawPut(storeName, obj) {
  obj._dirty = false;
  return new Promise((resolve, reject) => {
    const t = db.transaction(storeName, 'readwrite');
    t.objectStore(storeName).put(obj);
    t.oncomplete = () => resolve(obj);
    t.onerror = () => reject(t.error);
  });
}
function rawGet(storeName, id) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(storeName, 'readonly');
    const req = t.objectStore(storeName).get(id);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => reject(req.error);
  });
}
function rawGetAll(storeName) {
  return new Promise((resolve, reject) => {
    const t = db.transaction(storeName, 'readonly');
    const req = t.objectStore(storeName).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = () => reject(req.error);
  });
}

// 打开 app / 登录后拉取：远端 updated_at > 本地则覆盖（含 deleted_at 软删传播）；拉来的行 _dirty=false 不重推
async function syncPull() {
  const s = sbSession();
  if (!s) return;
  const headers = sbHeaders(s.access_token);
  for (const { table, store: sn } of SYNC_TABLES) {
    let rows = [];
    try {
      const res = await sbFetch(SB_REST + '/' + table + '?select=*', { headers });
      if (!res.ok) { console.warn('pull ' + table + ':', res.status); continue; }
      rows = await res.json();
    } catch (e) { console.warn('pull ' + table + ' err:', e.message); continue; }
    for (const row of rows) {
      const local = await rawGet(sn, row.id);
      if (!local || tsOf(row.updated_at) > tsOf(local.updated_at)) {
        await rawPut(sn, row); // rawPut 设 _dirty=false，拉来的不重推
      }
    }
  }
  // dismissed：upsert（无 LWW，按 arxiv_id 追加）
  try {
    const dres = await sbFetch(SB_REST + '/dismissed?select=*', { headers });
    if (dres.ok) {
      const rows = await dres.json();
      for (const row of rows) await rawPut('dismissed', { arxiv_id: row.arxiv_id, dismissed_at: row.dismissed_at });
    }
  } catch (e) { console.warn('pull dismissed err:', e.message); }
  // user_secrets（v2）：单行/用户，LWW 拉取缓存（跨设备共享 DeepSeek key）
  try {
    const sres = await sbFetch(SB_REST + '/user_secrets?select=*', { headers });
    if (sres.ok) {
      const rows = await sres.json();
      for (const row of rows) {
        const local = await rawGet('user_secrets', row.user_id);
        if (!local || tsOf(row.updated_at) > tsOf(local.updated_at)) {
          await rawPut('user_secrets', row); // rawPut 设 _dirty=false
        }
      }
    }
  } catch (e) { console.warn('pull user_secrets err:', e.message); }
  await trPurgeOrphans().catch((e) => console.warn('purge orphans:', e.message)); // 清孤儿译文（paper 已删但译文残留）
  render();
  renderTranslateSection(); // v2：拉到 key 后刷新设置页（若打开）
}

// 本地变更后防抖推送：只推 _dirty=true 的行（dbPut/dbDelete 置 true），upsert 成功后置 false；_dirty 不进 Supabase
async function syncPush() {
  const s = sbSession();
  if (!s) return;
  if (pushing) return; // 并发守卫：上一次 push 未完成则跳过（schedulePush 会再次触发）
  pushing = true;
  try {
    const headers = sbHeaders(s.access_token);
    const userId = s.user.id;
    for (const { table, store: sn } of SYNC_TABLES) {
      const all = await rawGetAll(sn);
      const dirty = all.filter((r) => r._dirty === true);
      if (!dirty.length) continue;
      const payload = dirty.map((r) => {
        const x = Object.assign({}, r, { user_id: userId });
        delete x._dirty; // 本地标记，不进 Supabase
        if (x.deleted_at === undefined) x.deleted_at = null;
        if (table === 'annotations' && (x.note === null || x.note === undefined)) x.note = ''; // NOT NULL 兜底
        return x;
      });
      try {
        const res = await sbFetch(SB_REST + '/' + table + '?on_conflict=id', {
          method: 'POST',
          headers: Object.assign({}, headers, { Prefer: 'resolution=merge-duplicates' }),
          body: JSON.stringify(payload),
        });
        if (!res.ok) { console.warn('push ' + table + ':', res.status, await res.text()); continue; }
        for (const r of dirty) { r._dirty = false; await rawPut(sn, r); } // 成功：标记已同步
      } catch (e) { console.warn('push ' + table + ' err:', e.message); }
    }
    // dismissed：只推 _dirty=true
    const dismissed = await rawGetAll('dismissed');
    const dDirty = dismissed.filter((d) => d._dirty === true);
    if (dDirty.length) {
      const payload = dDirty.map((d) => ({ user_id: userId, arxiv_id: d.arxiv_id, dismissed_at: d.dismissed_at }));
      try {
        const res = await sbFetch(SB_REST + '/dismissed?on_conflict=user_id,arxiv_id', {
          method: 'POST',
          headers: Object.assign({}, headers, { Prefer: 'resolution=merge-duplicates' }),
          body: JSON.stringify(payload),
        });
        if (res.ok) { for (const d of dDirty) { d._dirty = false; await rawPut('dismissed', d); } }
      } catch (e) { console.warn('push dismissed err:', e.message); }
    }
    // user_secrets（v2）：单行，on_conflict=user_id（payload 不含 deleted_at，该表无此列）
    const secret = await rawGetAll('user_secrets');
    const sDirty = secret.filter((r) => r._dirty === true);
    if (sDirty.length) {
      const payload = sDirty.map((r) => ({
        user_id: r.user_id || userId,
        deepseek_key: r.deepseek_key || '',
        updated_at: r.updated_at,
      }));
      try {
        const res = await sbFetch(SB_REST + '/user_secrets?on_conflict=user_id', {
          method: 'POST',
          headers: Object.assign({}, headers, { Prefer: 'resolution=merge-duplicates' }),
          body: JSON.stringify(payload),
        });
        if (res.ok) { for (const r of sDirty) { r._dirty = false; await rawPut('user_secrets', r); } }
        else { console.warn('push user_secrets:', res.status, await res.text()); }
      } catch (e) { console.warn('push user_secrets err:', e.message); }
    }
  } finally { pushing = false; }
}

// ===== Supabase Storage：本地 PDF（§3.6/§4.1；bucket=pdfs，路径 <uid>/<paperId>.pdf；arXiv/url 不传）=====
// IDB pdfFiles 仍作离线缓存保留，Storage 是跨设备真相源。openReader：IDB 优先，缺失 fallback Storage 下载。
function sbStoragePath(paperId) {
  const s = sbSession();
  if (!s) return null;
  return '/storage/v1/object/pdfs/' + s.user.id + '/' + paperId + '.pdf';
}
// 上传：自定义 401 重试（fetch 会 transfer ArrayBuffer，重试需 slice 副本；sbFetch 的重试对 body 无效）
async function sbUploadPdf(paperId, data) {
  const s = sbSession();
  if (!s) return false;
  const url = SUPABASE_URL + sbStoragePath(paperId);
  const hdr = (tok) => ({ apikey: SUPABASE_KEY, Authorization: 'Bearer ' + tok, 'Content-Type': 'application/octet-stream', 'x-upsert': 'true' });
  const backup = data.slice(0); // 防止首次 fetch transfer 后 body detached
  // M8 修复：2 分钟超时，防网络卡住导致上传永不返回（save 已改后台非阻塞，但避免 promise 悬空）
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 120000);
  try {
    let res = await fetch(url, { method: 'PUT', headers: hdr(s.access_token), body: data, signal: ctrl.signal });
    if (res.status === 401) {
      const refreshed = await sbRefresh();
      if (refreshed) res = await fetch(url, { method: 'PUT', headers: hdr(refreshed.access_token), body: backup, signal: ctrl.signal });
    }
    return res.ok;
  } catch (e) {
    return false; // 超时/网络错误 -> 视为上传失败（save 侧提示用户重试）
  } finally {
    clearTimeout(timer);
  }
}
async function sbDownloadPdf(paperId) {
  const s = sbSession();
  if (!s) return null;
  const res = await sbFetch(SUPABASE_URL + sbStoragePath(paperId), {
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + s.access_token },
  });
  if (!res.ok) return null;
  return await res.arrayBuffer();
}
async function sbDeletePdf(paperId) {
  const s = sbSession();
  if (!s) return false;
  const res = await sbFetch(SUPABASE_URL + sbStoragePath(paperId), {
    method: 'DELETE',
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + s.access_token },
  });
  return res.ok;
}

// ===== 今日推荐（M5 §4）：拉取 / 打分 / 过滤 / 去重 / 缓存 + 想读 / 跳过 =====
// 信号（与用户对齐）：时效 recency + 作者亲和 authorAffinity + 关键词密度 keywordDensity
// 软出现：search_query 只按分类（cat:cs.CL OR ...），关键词降为 app 端打分信号，不进 search_query
// topK = 15；每订阅拉 100 篇；订阅间 ≥3s 限速（arXiv 礼貌使用）；当日结果缓存到 localStorage
const FEED_TOP_K = 15;
const FEED_PER_SUB = 100;
const FEED_RATE_LIMIT_MS = 3000;
const FEED_CACHE_PREFIX = 'm5-feed-';
let feedCache = null; // 今日已打分 items（dismissed/existing 过滤在 render 时实时做）
let feedFreshness = null; // 'updated'（刚拉取）/ 'cached'（当日缓存）/ null

function sleep(ms) { return new Promise((r) => setTimeout(r, ms)); }

function buildSearchQuery(sub) {
  // 软出现：仅分类，组间 OR
  return (sub.categories || []).map((c) => 'cat:' + c).join(' OR ');
}

async function fetchFeedForSub(sub) {
  const params = new URLSearchParams({
    search_query: buildSearchQuery(sub),
    max_results: String(FEED_PER_SUB),
    sortBy: 'submittedDate',
    sortOrder: 'descending',
  });
  const res = await fetch(ARXIV_PROXY + '?' + params.toString());
  if (!res.ok) throw new Error('代理返回 HTTP ' + res.status);
  const xml = await res.text();
  return parseArxivXmlList(xml);
}

// 打分：返回 { score, matchedKws }
function scorePaper(meta, sub, userAuthors) {
  // 1) 时效：14 天内线性衰减，>14 天为 0
  let recency = 0;
  if (meta.published) {
    const t = Date.parse(meta.published);
    if (Number.isFinite(t)) {
      const days = (Date.now() - t) / 86400000;
      recency = Math.max(0, 1 - days / 14);
    }
  }
  // 2) 作者亲和：命中用户已跟踪作者 -> 1，否则 0
  const affAuthors = (meta.authors || []).map((a) => String(a).toLowerCase());
  const affinity = affAuthors.some((a) => userAuthors.has(a)) ? 1 : 0;
  // 3) 关键词密度：组内 OR、组间 AND；打分 = 命中组数 / 总组数（无关键词组则 0）
  const groups = sub.keywords || [];
  const hay = ((meta.title || '') + ' ' + (meta.abstract || '')).toLowerCase();
  let matchedGroups = 0;
  const matchedKws = [];
  for (const g of groups) {
    let hit = false;
    for (const kw of (g || [])) {
      const k = String(kw).toLowerCase();
      if (k && hay.includes(k)) {
        hit = true;
        if (matchedKws.indexOf(k) < 0) matchedKws.push(k);
      }
    }
    if (hit) matchedGroups++;
  }
  const keywordDensity = groups.length ? matchedGroups / groups.length : 0;
  const score = recency * 1.0 + keywordDensity * 0.6 + affinity * 0.4;
  return { score, matchedKws };
}

async function fetchDailyFeed(force) {
  const today = new Date().toISOString().slice(0, 10);
  const cacheKey = FEED_CACHE_PREFIX + today;
  if (!force) {
    try {
      const cached = JSON.parse(localStorage.getItem(cacheKey) || 'null');
      if (cached && Array.isArray(cached.items)) return { items: cached.items, status: 'cached' };
    } catch (e) {}
  }
  const subs = (await dbGetAllSubs().catch(() => [])).filter((s) => s.enabled);
  if (!subs.length) return { items: [], status: 'no-subs' };
  const allPapers = await dbAll().catch(() => []);
  const userAuthors = new Set();
  allPapers.forEach((p) => (p.authors || []).forEach((a) => userAuthors.add(String(a).toLowerCase())));
  const dismissed = new Set(await dbGetAllDismissed().catch(() => []));
  const existingIds = new Set(allPapers.map((p) => p.arxiv_id).filter(Boolean));
  const seen = new Set();
  const items = [];
  for (let i = 0; i < subs.length; i++) {
    const sub = subs[i];
    let metas = [];
    try { metas = await fetchFeedForSub(sub); }
    catch (e) { continue; } // 单订阅失败不阻断其余
    for (const meta of metas) {
      if (!meta.arxiv_id) continue;
      if (seen.has(meta.arxiv_id)) continue;          // 跨订阅去重
      seen.add(meta.arxiv_id);
      if (dismissed.has(meta.arxiv_id)) continue;     // 已跳过
      if (existingIds.has(meta.arxiv_id)) continue;   // 已在库
      const s = scorePaper(meta, sub, userAuthors);
      items.push({
        arxiv_id: meta.arxiv_id, title: meta.title, authors: meta.authors,
        abstract: meta.abstract, url: meta.url, tags: meta.tags, published: meta.published,
        _score: s.score, _matchedKws: s.matchedKws, _sub: sub.name,
      });
    }
    if (i < subs.length - 1) await sleep(FEED_RATE_LIMIT_MS); // arXiv 礼貌限速
  }
  items.sort((a, b) => b._score - a._score);
  const top = items.slice(0, FEED_TOP_K);
  try { localStorage.setItem(cacheKey, JSON.stringify({ items: top, fetched_at: nowISO() })); } catch (e) {}
  return { items: top, status: 'ok' };
}

function setFeedStatus(msg) {
  const el = document.getElementById('feed-status');
  if (el) el.textContent = msg || '';
}

async function loadFeed(force) {
  const listEl = document.getElementById('list-feed');
  if (!listEl) return;
  const subs = (await dbGetAllSubs().catch(() => [])).filter((s) => s.enabled);
  if (!subs.length) {
    setFeedStatus('');
    listEl.innerHTML = '<div class="empty">还没有启用的订阅。先到「⚙ 设置」添加 arXiv 分类订阅，日推会每天拉最新投稿。</div>';
    feedCache = null;
    feedFreshness = null;
    return;
  }
  const willFetch = force || !feedCache;
  if (willFetch) {
    setFeedStatus(force ? '刷新中…' : '加载中…');
    listEl.innerHTML = '<div class="empty">正在拉取今日推荐…</div>';
  }
  try {
    const { items, status } = await fetchDailyFeed(force);
    feedCache = items;
    if (willFetch) feedFreshness = (status === 'cached') ? 'cached' : 'updated';
  } catch (e) {
    listEl.innerHTML = '<div class="empty">拉取失败：' + escapeHtml(e && e.message ? e.message : e) + '</div>';
    setFeedStatus('失败');
    return;
  }
  await renderFeedFromCache();
}

async function renderFeedFromCache() {
  const el = document.getElementById('list-feed');
  if (!el) return;
  const items = feedCache || [];
  // 实时过滤：跳过的 / 已在库的（缓存可能早于这些操作，故 render 时再过一遍）
  const dismissed = new Set(await dbGetAllDismissed().catch(() => []));
  const allPapers = await dbAll().catch(() => []);
  const existingIds = new Set(allPapers.map((p) => p.arxiv_id).filter(Boolean));
  const visible = items.filter((it) => it.arxiv_id && !dismissed.has(it.arxiv_id) && !existingIds.has(it.arxiv_id));
  renderFeedList(visible);
  // 状态显示当前可见数（want/skip 后同步更新，避免计数陈旧）
  const label = feedFreshness === 'cached' ? '缓存' : '已更新';
  setFeedStatus(visible.length > 0 ? label + ' · ' + visible.length + ' 篇' : '');
}

function renderFeedList(items) {
  const el = document.getElementById('list-feed');
  if (!el) return;
  el.innerHTML = '';
  if (!items || !items.length) {
    el.innerHTML = '<div class="empty">今天没有新的推荐（可能已全部看过或跳过）。点「刷新推荐」重试。</div>';
    return;
  }
  items.forEach((item) => el.appendChild(renderFeedCard(item)));
}

function renderFeedCard(item) {
  const el = document.createElement('div');
  el.className = 'card feed-card';
  const cats = (item.tags || []).slice(0, 4).map((t) => '<span class="tag">' + escapeHtml(t) + '</span>').join('');
  const kws = (item._matchedKws || []).map((k) => '<span class="tag kw-tag">' + escapeHtml(k) + '</span>').join('');
  const abs = item.abstract || '';
  const absExcerpt = abs.slice(0, 200) + (abs.length > 200 ? '…' : '');
  el.innerHTML =
    '<div class="title">' + escapeHtml(item.title) + '</div>' +
    '<div class="authors">' + escapeHtml((item.authors || []).join(', ')) + '</div>' +
    (absExcerpt ? '<div class="feed-abs">' + escapeHtml(absExcerpt) + '</div>' : '') +
    '<div class="meta">' +
      '<span class="badge score-badge">推荐 ' + item._score.toFixed(2) + '</span>' +
      (item._sub ? '<span class="badge sub-badge">' + escapeHtml(item._sub) + '</span>' : '') +
      cats + kws +
    '</div>' +
    '<div class="actions">' +
      '<button class="btn-primary" data-act="want">加入想读</button>' +
      '<button class="btn-secondary" data-act="skip">跳过</button>' +
      (item.url ? '<a class="url-link" href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">arXiv ↗</a>' : '') +
    '</div>';
  el.querySelector('[data-act="want"]').addEventListener('click', () => feedWant(item));
  el.querySelector('[data-act="skip"]').addEventListener('click', () => feedSkip(item));
  return el;
}

async function feedWant(item) {
  try {
    const paper = {
      id: uid(),
      title: item.title,
      authors: item.authors || [],
      abstract: item.abstract || null,
      source_type: 'arxiv',
      arxiv_id: item.arxiv_id,
      url: item.url,
      local_file_path: null,
      status: 'want',
      rating: null,
      tags: item.tags || [],
      notes_md: '',
      read_progress: 0,
      added_at: nowISO(),
      updated_at: nowISO(),
    };
    await dbPut(paper);
    render(); // 刷新阅读队列
    await renderFeedFromCache(); // 从日推移除该篇（已在库 -> existingIds 过滤）
  } catch (e) {
    alert('加入想读失败：' + (e && e.message ? e.message : e));
  }
}

async function feedSkip(item) {
  try {
    await dbPutDismiss(item.arxiv_id);
    await renderFeedFromCache(); // dismissed 过滤后该篇消失
  } catch (e) {
    alert('跳过失败：' + (e && e.message ? e.message : e));
  }
}

document.getElementById('f-file').addEventListener('change', async (e) => {
